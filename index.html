<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Upload to B2 via Workers</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial; margin: 24px; }
    .box { max-width: 680px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 12px; }
    .row { margin: 12px 0; }
    #bar { width: 100%; height: 10px; background: #eee; border-radius: 6px; overflow: hidden; }
    #bar > div { height: 100%; width: 0%; background: #4caf50; transition: width .1s linear; }
    code { background: #f5f5f5; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>アップロード</h1>

    <!-- ===== 設定（ここだけ編集すればOK） ===== -->
    <div class="row">
      <label>Worker URL：</label>
      <input id="workerInput" style="width:100%" />
    </div>
    <!-- ===================================== -->

    <div class="row">
      <input id="file" type="file" multiple />
    </div>
    <div class="row">
      <label>イベントID：</label>
      <input id="eventId" placeholder="20251012-concertA" />
    </div>
    <div class="row">
      <button id="go">アップロード開始</button>
    </div>
    <div class="row">
      <div id="bar"><div></div></div>
      <div id="status"></div>
      <div id="result"></div>
    </div>
    <hr />
    <p>Worker: <code id="workerOrigin"></code></p>
  </div>

  <script>
    /***********************
     *  必要な設定（上部固定）
     ***********************/
    // ★あなたの Cloudflare Workers 本番URLに置換（例: https://taiko-worker-plain.xxx.workers.dev）
    const DEFAULT_WORKER_ORIGIN = "https://taiko-worker-plain.fujizukadaiko.workers.dev";
    // 制限など（必要に応じて変更）
    const MAX_FILE_MB = 2048; // 例: 2GBまで
    const DEFAULT_EXPIRES_SEC = 600;

    // 画面に反映
    const workerInput = document.getElementById("workerInput");
    workerInput.value = DEFAULT_WORKER_ORIGIN;
    const showWorker = () => document.getElementById("workerOrigin").textContent = workerInput.value;
    workerInput.addEventListener("input", showWorker);
    showWorker();

    // ユーティリティ
    const pad2 = (n) => String(n).padStart(2, "0");
    const yyyymm = (d=new Date()) => d.getFullYear() + pad2(d.getMonth()+1);

    document.getElementById("go").onclick = async () => {
      const WORKER_ORIGIN = workerInput.value.trim();
      if (!/^https?:\/\//.test(WORKER_ORIGIN)) {
        alert("Worker URL が不正です"); return;
      }

      const files = document.getElementById("file").files;
      const eventId = document.getElementById("eventId").value.trim() || "event-" + yyyymm();
      if (!files.length) return alert("ファイルを選んでください。");

      const bar = document.querySelector("#bar > div");
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      result.innerHTML = ""; status.textContent = ""; bar.style.width = "0%";

      for (let i = 0; i < files.length; i++) {
        const f = files[i];

        // サイズチェック（任意）
        if (f.size > MAX_FILE_MB * 1024 * 1024) {
          alert(`${f.name} は ${MAX_FILE_MB}MB を超えています`); continue;
        }

        const month = yyyymm();
        const rand = Math.random().toString(36).slice(2, 8);
        const safeName = f.name.replace(/[^\w.\-]/g, "_");
        const key = `staging/${month}/${eventId}/${Date.now()}_${rand}_${safeName}`;
        const contentType = f.type || "application/octet-stream";

        // === 代理PUTに切替（CORS問題を回避） ===
        const proxyUrl = `${WORKER_ORIGIN}/uploads/proxy-put?key=${encodeURIComponent(key)}&contentType=${encodeURIComponent(contentType)}`;

        // XHRで進捗表示しつつアップロード
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", proxyUrl, true);
          xhr.timeout = 120000; // 120秒でタイムアウト（必要に応じて延長可）
        
          xhr.upload.onprogress = (ev) => {
            if (ev.lengthComputable) {
              const p = Math.round((ev.loaded / ev.total) * 100);
              bar.style.width = p + "%";
              status.textContent = `アップロード中 ${i+1}/${files.length} ... ${p}%`;
              console.log("progress", ev.loaded, "/", ev.total, p + "%");
            } else {
              console.log("progress (uncounted)", ev.loaded);
            }
          };
          xhr.onreadystatechange = () => {
            if (xhr.readyState === 2) console.log("HEADERS_RECEIVED");
            if (xhr.readyState === 3) console.log("LOADING");
            if (xhr.readyState === 4) console.log("DONE status", xhr.status);
          };
          xhr.onload = () => (xhr.status >= 200 && xhr.status < 300)
            ? resolve()
            : reject(new Error("proxy PUT " + xhr.status));
          xhr.ontimeout = () => reject(new Error("proxy PUT timeout"));
          xhr.onerror = () => reject(new Error("proxy PUT network error"));
          xhr.send(f);
        });

        // 確認用の一時GETリンク（任意）
        const getRes = await fetch(`${WORKER_ORIGIN}/files/presign-get`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ key, expires: DEFAULT_EXPIRES_SEC / 2 }),
        });
        const { url: getUrl } = await getRes.json().catch(() => ({ url: null }));

        const a = document.createElement("a");
        a.href = getUrl || "#";
        a.textContent = `アップロード完了: ${safeName}（一時URL/数分）`;
        a.target = "_blank";
        const li = document.createElement("div");
        li.appendChild(a);
        result.appendChild(li);
      }

      status.textContent = "すべて完了！";
      bar.style.width = "100%";
    };
  </script>
</body>
</html>
