<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>動画・画像アップロード｜藤塚太鼓</title>
<meta name="theme-color" content="#0a0b11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<script src="https://unpkg.com/exifr/dist/full.umd.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* ===== カラーパレット（水色系） ===== */
  :root{
    --brand:#a2d7dd;   /* 主色（瓶覗） */
    --border-strong: #9fcbd6;/* 濃いめの枠線色 */
    --brand-d:#84b9cb; /* 濃いめ */
    --bgpage:#ebf6f7;  /* 藍白 */
    --panel:#ffffff;   /* カード背景 */
    --text:#1e2a1e;    /* 文字色 */
    --muted:#6e8d92;   /* サブ文字を水色系に */
    --border:#c1e4e9;  /* 枠線 */
    --accent:#a2d7dd;  /* 補助で同色を使う */
    --accent-2:#86c4a0;/* 進捗バー色（ミント） */
  }

  /* 使い方（ghost）＝うっすい水色チップ */
  .btn.ghost{
    border: 1px solid var(--border-strong);     /* ← ここだけ差し替え */
    background: #f2fbfd;
    color: #1f2d32;
  }

  *{ box-sizing:border-box }
  html,body{ height:100% }

  /* ページ背景 */
  html{ background:var(--bgpage) }
  body{
    margin:0;
    min-height:100svh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:var(--bgpage);
    color:var(--text);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial;
  }

  /* 画面左右に余白 */
  .container{ max-width:860px; margin:24px auto; padding:0 14px }

  /* ヘッダ */
  .topbar{
    display:flex; gap:12px; align-items:center; justify-content:space-between;
    background:#fff; border:1px solid var(--border);
    padding:14px 16px; border-radius:16px; margin:12px 0 20px;
  }

  /* タイトル（少し小さめ） */
  .brand h1{
    font-size:clamp(18px, 3.8vw, 22px);
    line-height:1.25; margin:0;
  }

  /* カード */
  .box{
    background:var(--panel); border:1px solid var(--border);
    max-width:860px; margin:0 auto; padding:18px; border-radius:16px;
  }

  /* ファイル選択 */
  .filebox{ display:flex; gap:10px; align-items:center; flex-wrap:wrap }
  input[type="file"]{ display:none }
  .filebtn{
    background:#fff; border: 2px solid var(--border-strong);
    color:var(--text); padding:12px 14px; border-radius:14px;
    cursor:pointer; box-shadow:none; font-size:13px;
  }
  .filebtn:hover{ filter:brightness(1.02) }
  .fileinfo{ color:var(--muted); font-size:12px }

  /* ボタン */
  .btn{
    background:var(--brand); color:#102010; border:none;
    padding:12px 16px; border-radius:12px; cursor:pointer;
  }
  .btn.small{ padding:8px 12px; font-size:13px; border-radius:999px }
  .btn:active{ transform:translateY(1px) }

  /* アップロード開始（横長・細字・上に余白） */
  #go{
    width:100%; max-width:680px; display:block;
    margin:10px auto 0; font-size:12px; font-weight:400;
  }

  /* 進捗バー：ベースも水色、塗りはやや濃い水色 */
  #bar{
    width:100%; height:12px;
    background:#e8f6f8;                /* ← 青みの淡色 */
    border:1px solid var(--border);
    border-radius:999px; overflow:hidden;
    margin-top:12px;
  }
  #bar>div{
    height:100%; width:0;
    background:var(--brand-d);         /* ← 濃いめ水色で進捗 */
    transition:width .15s linear;
  }

  /* 履歴 */
  .item-row{ padding:12px 0; border-bottom:1px dashed #dfead4 }
  .hist-name{ font-size:14px; line-height:1.4; color:#406040 }
  .hist-name:hover{ text-decoration:underline }
  .item-row.cancelled{ opacity:.55; filter:grayscale(.15) }
  .status-cancelled{
    display:inline-block; margin-left:8px; padding:3px 8px; border-radius:999px;
    background:#f3f7ef; color:#6f7f6a; border:1px solid var(--border); font-size:12px;
  }
  .row-actions{ display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap }
  .row-actions .pill{
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    border:1px solid var(--border); border-radius:999px; background:#f7fbf3; color:var(--text);
  }

  /* ステータス表示（「アップロード中…」「すべて完了！」） */
  #status{
    font-size:12px;                    /* 小さく */
    color:#3a5b61;                     /* 少し濃い寒色 */
    margin-top:6px;
  }

  @media (max-width:600px){
    .btn{ width:100% }
    .row-actions .btn{ width:auto }
    .row-actions .btn.small{ padding:8px 12px }
  }

  /* フッター（中央・小さく・薄く） */
  footer{
    color:#94a38f; font-size:11px; margin:28px 0; text-align:center;
  }

  /* 見出し */
  .hist-title{ margin:16px 0 6px; font-size:16px }
  .hist-title .note{ font-size:12px; color:var(--muted); margin-left:6px }

  /* 取り消しボタン（水色で統一） */
  .btn.cancel {
    background:var(--brand);           /* 通常ボタンと同色の水色 */
    color:#0e2328;
  }
  
  /* 取り消しのカウントダウンのタイポをボタンと合わせる */
  .row-actions .pill span{
    font-size:13px;                    /* 「再発行」と同じ */
    line-height:1.2;
  }
  
  /* ピル全体も水色系に寄せる */
  .row-actions .pill{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0;                 /* 内側余白なし */
    border:0;                  /* 枠なし */
    background:transparent;    /* 背景なし */
  }
  
  /* カウントダウンの見た目（再発行と同サイズ感） */
  .row-actions .countdown{
    font-size:12px;
    color:#516b70;
  }
  
  /* 「取り消し済み」チップも水色トーンに */
  .status-cancelled{
    background:#f2fbfd;
    color:#598a93;
    border:1px solid var(--border);
    font-size:12px;
  }
  #history-block{
    position:relative;
    margin-top:16px;
    padding-top:14px;
  }
  #history-block::before{
    content:"";
    position:absolute;
    left:0; right:0; top:0;
    height:1px;
    background:linear-gradient(
      to right,
      rgba(161, 212, 221, 0),     /* 透明 → */
      rgba(161, 212, 221, .55),   /* 中央やや濃い */
      rgba(161, 212, 221, 0)      /* → 透明 */
    );
  }
  /* 進捗の下に注意書き用（小文字） */
  .tiny-note{
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
  }
  
  /* アンカーでも下線を消してボタン化 */
  a.btn { 
    text-decoration: none; 
    display: inline-block; 
  }
  
  /* 使い方ボタンと同じゴーストボタン（薄い水色チップ風） */
  .btn.ghost{
    background:#f2fbfd;          /* 薄い水色 */
    color:#1f2d32;               /* 文字は寒色寄り */
    border:1px solid var(--border);
  }
  
  /* 小さめ角丸・高さ感は small に合わせる */
  .btn.small{
    padding:8px 12px;
    font-size:13px;
    border-radius:10px;          /* 角を四角寄りに（必要なければ既存の999pxでもOK） */
  }
  
  /* アクセシビリティ的にフォーカスリングだけ薄めで */
  .btn:focus-visible{
    outline: 2px solid rgba(162,215,221,.6);
    outline-offset: 2px;
  }
  /* 選択中ファイルのプレリスト */
  #prelist .fitem{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:8px 10px; margin:6px 0;
    background:#fff; border:1px solid var(--border); border-radius:10px;
  }
  #prelist .fleft{
    min-width:0; display:flex; align-items:center; gap:8px;
  }
  #prelist .fname{
    font-size:13px; color:var(--text);
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    max-width: min(70vw, 520px);
  }
  #prelist .fsize{
    font-size:12px; color:var(--muted);
  }
  #prelist .delbtn{
    border:1px solid var(--brand-d);
    background:#f2fbfd; color:#1f2d32;
    padding:6px 10px; border-radius:8px; cursor:pointer;
  }
  #prelist .delbtn:active{ transform: translateY(1px); }
  
  .topbar .right { margin-left:auto; }
  .topbar .btn.ghost { /* 薄い水色チップ風（既に設定済みなら不要） */
    background:#f2fbfd;
    color:#1f2d32;
    border:1px solid var(--border);
}
</style>
</head>
<body>
<div class="container">
 <header class="topbar">
  <div class="brand">
    <h1>動画・画像アップロード</h1>
  </div>
  <div class="right">
    <a id="toCatalog" class="btn ghost small" href="#" role="button">カタログへ</a>
  </div>
</header>

  <section class="box">
    <div class="row filebox">
      <label class="filebtn" for="file">ファイルを選ぶ（画像/動画・複数可）</label>
      <input id="file" type="file" accept="image/*,video/*" multiple />
      <span class="fileinfo" id="fileinfo">未選択</span>
    </div>
    <!-- 追加：選択中ファイルのプレリスト -->
    <div class="row">
      <div id="prelist"></div>
    </div>
    <div class="row">
      <button class="btn" id="go">アップロード開始</button>
    </div>

    <div class="row">
      <div id="bar"><div></div></div>
      <div id="status" style="margin-top:8px;color:#cfd4e1"></div>
      <div id="note" class="tiny-note"></div> 
    </div>

    <div class="row" id="history-block">
      <h3 class="hist-title">アップロード履歴 <span class="note">（一時URLの有効期間は約5分）</span></h3>
      <div id="result"></div>
    </div>
  </section>

  <footer id="copyright"></footer>
  <script>
    // 初出年を必要に応じて変更
    const FIRST_YEAR = 1996;
    const y = new Date().getFullYear();
    const range = (y === FIRST_YEAR) ? `${y}` : `${FIRST_YEAR}–${y}`;
    // 実際の権利者名に置き換えてください
    const holder = "藤塚太鼓";
    document.getElementById("copyright").textContent = `© ${range} ${holder}`;
  </script>
</div>

<script>
/** ===== 設定（ここだけ変更） ===== */
const WORKER_ORIGIN = "https://taiko-worker-plain.fujizukadaiko.workers.dev";  // 例: https://taiko-worker-plain.xxx.workers.dev
const MAX_FILE_MB = 2048;
const PRESIGN_EXPIRES = 300;       // 一時URL 5分
const SELF_DELETE_TTL_SEC = 30*60; // 30分（参考表示用）
const LS_KEY = "tm/uploads/v1";    // ローカル履歴のキー
const CANCELLED_KEEP_MS = 6 * 60 * 60 * 1000; // 取り消し済を残す期間
const THRESHOLD_MB = 300;          // 300MB超→外部ブラウザ誘導
const CATALOG_URL = "https://fujizukadaiko.github.io/taiko-media-front-test/catalog.html";   // ←実URLに
const STANDALONE_URL = "https://fujizukadaiko.github.io/taiko-media-front-test/index.html";  // ←このページ

/** ===== LIFF 初期化 & 外部遷移 ===== */
const LIFF_ID = "YOUR_LIFF_ID"; // ←実IDに置換
let liffReady = false;
const isLine = /Line\/[\d.]+/i.test(navigator.userAgent || "");

async function initLiffIfPossible(){
  if (typeof window.liff === "undefined") return false; // SDK未ロード時
  if (liffReady) return true;
  try{
    await liff.init({ liffId: LIFF_ID });
    liffReady = true;
  }catch(_){}
  return liffReady;
}

async function openExternal(url){
  if (isLine){
    // LINE内ならLIFFのexternalで確実に外部ブラウザへ
    await initLiffIfPossible();
    try{
      if (window.liff && liff.isInClient()){
        liff.openWindow({ url, external: true });
        return;
      }
    }catch(_){}
    // 保険：同タブ遷移（_blankがブロックされることがある）
    location.replace(url);
    return;
  }
  // 通常ブラウザ
  const w = window.open(url, "_blank");
  if (!w) location.href = url;
}
  
/** ===== 便利関数 ===== */
const $ = (s,p=document)=>p.querySelector(s);
const pad2 = (n)=> String(n).padStart(2,"0");
function ymdSegments(d=new Date()){
  const Y=d.getFullYear(), M=pad2(d.getMonth()+1), D=pad2(d.getDate());
  return { y:`${Y}`, ym:`${Y}${M}`, ymd:`${Y}${M}${D}` };
}
async function detectTakenAt(file){
  try{
    if (/\.(jpe?g|heic|heif|webp|tiff?)$/i.test(file.name)) {
      const exif = await exifr.parse(file, { userComment:false });
      const d = exif?.DateTimeOriginal || exif?.CreateDate || exif?.ModifyDate;
      if (d instanceof Date && !isNaN(+d)) return { at:d, source:"exif" };
    }
  }catch{}
  return { at: file.lastModified ? new Date(file.lastModified) : new Date(), source:"lastModified" };
}

/** ===== 履歴（保存・描画・掃除） ===== */
function loadHistory(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch{ return []; } }
function saveHistory(list){ localStorage.setItem(LS_KEY, JSON.stringify(list.slice(-200))); }
function addHistory(entry){ const list = loadHistory(); list.push(entry); saveHistory(list); renderHistory(); }
function removeHistoryByKey(key){ saveHistory(loadHistory().filter(x=>x.key!==key)); renderHistory(); }
function fmtRemain(ms){ if(ms<=0) return "期限切れ"; const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000); return `${m}分${pad2(s)}秒`; }

async function reissueUrl(item, btn){
  if (btn) { btn.disabled=true; btn.setAttribute('aria-busy','true'); btn._prevText=btn.textContent; btn.textContent='発行中…'; }
  try{
    const res = await fetch(`${WORKER_ORIGIN}/files/presign-get`,{
      method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ key:item.key, expires:PRESIGN_EXPIRES })
    });
    if(!res.ok) throw new Error(`presign-get ${res.status}`);
    const { url } = await res.json();
    item.lastPresignUrl = url || "";
    item.lastPresignAt  = Date.now();
    const list = loadHistory(); const idx = list.findIndex(x=>x.key===item.key);
    if(idx>=0){ list[idx]=item; saveHistory(list); }
    if (btn) {
      btn.textContent='発行済み ✓'; btn.setAttribute('aria-busy','false');
      setTimeout(()=>{ btn.textContent=btn._prevText||'再発行'; btn.disabled=false; renderHistory(); },1200);
    } else { renderHistory(); }
    return item.lastPresignUrl || "";
  }catch(e){
    console.error(e);
    if (btn) { btn.textContent='失敗…再試行'; btn.disabled=false; btn.setAttribute('aria-busy','false'); }
    return null;
  }
}

function pruneHistoryExpired(){
  const now = Date.now();
  const list = loadHistory();
  const kept = list.filter(it=>{
    if (it.deleteUntil && !it.cancelled) {
      const expired = new Date(it.deleteUntil).getTime() <= now;
      if (expired) return false;
    }
    if (it.cancelled && it.cancelledAt) {
      if (now - it.cancelledAt >= CANCELLED_KEEP_MS) return false;
    }
    return true;
  });
  if (kept.length !== list.length) saveHistory(kept);
}

function renderHistory(){
  pruneHistoryExpired();
  const list = loadHistory().slice().reverse();
  const box = $("#result");
  if (!box) return;
  box.innerHTML = "";

  for (const item of list){
    const row = document.createElement("div");
    row.className = "item-row" + (item.cancelled ? " cancelled" : "");

    const link = document.createElement("a");
    link.className = "hist-name";
    link.textContent = `アップロード完了：${item.name}`;

    const isExpired = ()=>{
      if (!item.lastPresignUrl || !item.lastPresignAt) return true;
      return (Date.now() - item.lastPresignAt) >= (PRESIGN_EXPIRES*1000 - 2000);
    };

    if (item.cancelled || !item.lastPresignUrl){ link.href="#"; link.classList.add("name-cancelled"); }
    else { link.href=item.lastPresignUrl; link.target="_blank"; }

    link.onclick = async (e)=>{
      if (item.cancelled) { e.preventDefault(); return; }
      if (!item.lastPresignUrl || isExpired()){
        e.preventDefault();
        if (!confirm("この一時URLは有効期限が切れています。新しいURLを再発行しますか？")) return;
        const newUrl = await reissueUrl(item, null);
        if (newUrl){ link.href=newUrl; link.target="_blank"; link.classList.remove("name-cancelled"); window.open(newUrl,"_blank"); }
      }
    };
    row.appendChild(link);

    if (item.cancelled){
      const tag = document.createElement("span");
      tag.className = "status-cancelled";
      tag.textContent = "取り消し済み";
      row.appendChild(tag);
    }

    const actions = document.createElement("div");
    actions.className = "row-actions";

    if (!item.cancelled){
      const btnRe = document.createElement("button");
      btnRe.className = "btn small ghost";
      btnRe.textContent = "再発行";
      btnRe.onclick = (e)=> reissueUrl(item, e.currentTarget);
      actions.appendChild(btnRe);

      if (item.deleteToken && item.deleteUntil){
        const pill = document.createElement("span"); pill.className = "pill";
        const btnDel = document.createElement("button"); btnDel.className = "btn small cancel"; btnDel.textContent = "取り消す";
        const remainSpan = document.createElement("span"); remainSpan.className = "countdown";
        let timerId = null;
        const updateRemain = ()=>{
          const ms = new Date(item.deleteUntil).getTime() - Date.now();
          if (ms <= 0){
            remainSpan.textContent = "期限切れ";
            if (timerId) clearInterval(timerId);
            setTimeout(()=> removeHistoryByKey(item.key), 800);
            return;
          }
          remainSpan.textContent = `残り ${fmtRemain(ms)}`;
        };
        updateRemain(); timerId = setInterval(updateRemain, 1000);

        btnDel.onclick = async ()=>{
          if (!confirm("このファイルを取り消します。よろしいですか？")) return;
          const res = await fetch(`${WORKER_ORIGIN}/files/self-delete`,{
            method:"POST", headers:{ "content-type":"application/json" },
            body: JSON.stringify({ token:item.deleteToken })
          });
          const js = await res.json().catch(()=>({}));
          if (res.ok && js.ok){
            if (timerId) clearInterval(timerId);
            item.cancelled = true; item.cancelledAt = Date.now(); item.lastPresignUrl = "";
            const all = loadHistory().map(x=> x.key===item.key ? item : x); saveHistory(all); renderHistory();
          }else{ alert("取り消しに失敗しました"); }
        };

        pill.appendChild(btnDel);
        pill.appendChild(remainSpan);
        actions.appendChild(pill);
      }
    }
    row.appendChild(actions);
    box.appendChild(row);
  }
}

/** ===== ファイル選択表示 ===== */
// ファイル選択時：合計表示＆プレリスト描画
// ファイル選択時：合計表示＆プレリスト描画＋しきい値チェック→外部ブラウザ誘導
document.getElementById("file")?.addEventListener("change", () => {
  updateFileInfo();
  renderPreUploadList();

  const fileEl = document.getElementById("file");
  const files  = fileEl?.files || [];
  if (!files.length) return;

  const totalMB = [...files].reduce((s,f)=> s + (f.size||0), 0) / 1024 / 1024;

  if (totalMB > THRESHOLD_MB) {
    const ok = confirm(
      `選択されたファイル合計は約 ${totalMB.toFixed(1)} MB です。\n` +
      `大容量はLINEアプリ内だと不安定な場合があります。外部ブラウザで開きますか？`
    );
    if (ok) {
      // 外部ブラウザで開く（LIFF があれば優先）
      if (window.liff && typeof window.liff.openWindow === "function") {
        window.liff.openWindow({ url: STANDALONE_URL, external: true });
      } else {
        window.open(STANDALONE_URL, "_blank");
      }
      // この画面の選択はクリアして負荷を残さない
      try { fileEl.value = ""; } catch {}
      const info = document.getElementById("fileinfo");
      if (info) info.textContent = "未選択";
      const pre = document.getElementById("prelist");
      if (pre) pre.innerHTML = "";
    }
  }
});

/** ===== ナビ導線（存在すれば） ===== */
document.getElementById("toCatalog")?.addEventListener("click", (e) => {
  e.preventDefault();
  location.href = CATALOG_URL; // 別タブにしたいなら window.open(CATALOG_URL, "_blank");
});
document.getElementById("openInBrowser")?.addEventListener("click", (e)=>{ e.preventDefault(); window.open(STANDALONE_URL, "_blank"); });

/** ===== メイン：アップロード ===== */
document.getElementById("go")?.addEventListener("click", async ()=>{
  if (!/^https?:\/\//.test(WORKER_ORIGIN)) { alert("Worker URL が不正です"); return; }

  const fileEl = document.getElementById("file");
  const files  = fileEl.files;
  if (!files.length) return alert("ファイルを選んでください。");

  // 合計サイズで外部ブラウザ誘導
  const totalMB = [...files].reduce((s,f)=> s + (f.size||0), 0) / 1024 / 1024;
  if (totalMB > THRESHOLD_MB) {
    const go = confirm(`選択されたファイル合計は約 ${totalMB.toFixed(1)} MB です。\n大容量はLIFF内だと不安定な場合があります。外部ブラウザで開きますか？`);
    if (go) { openExternal(STANDALONE_URL); return; }
  }

  const barFill  = document.querySelector("#bar > div");
  const statusEl = document.getElementById("status");
  const noteEl   = document.getElementById("note"); // 無ければ何もしない
  const fileInfo = document.getElementById("fileinfo");
  const goBtn    = document.getElementById("go");

  // UI初期化
  statusEl.textContent = "";
  statusEl.style.fontSize = "12px";
  statusEl.style.color = "#3b4b50";
  if (noteEl) noteEl.textContent = "";
  barFill.style.width = "0%";
  goBtn.disabled = true; goBtn.textContent = "アップロード中…";

  const total = files.length;
  let done = 0, successCount = 0;

  for (let i = 0; i < total; i++) {
    const f = files[i];
    try{
      if (f.size > MAX_FILE_MB * 1024 * 1024) { alert(`${f.name} は ${MAX_FILE_MB}MB を超えています`); continue; }

      statusEl.textContent = `アップロード中 ${i+1}/${total} … 0%`;
      if (noteEl) noteEl.textContent = "アップロード中は画面を開いたままにしてください（LIFFでは画面ロックで停止します）";

      const { at:takenAt } = await detectTakenAt(f);
      const { ym, ymd } = ymdSegments(takenAt);
      const rand = Math.random().toString(36).slice(2,8);
      const safeName = f.name.replace(/[^\w.\-]/g, "_");
      const timeSlug = `${pad2(takenAt.getHours())}${pad2(takenAt.getMinutes())}${pad2(takenAt.getSeconds())}`;
      const key = `staging/${ym}/${ymd}/${timeSlug}_${rand}_${safeName}`;
      const contentType = f.type || "application/octet-stream";

      // 代理PUT
      const proxyUrl = `${WORKER_ORIGIN}/uploads/proxy-put?key=${encodeURIComponent(key)}&contentType=${encodeURIComponent(contentType)}`;
      const delInfo = await new Promise((resolve, reject)=>{
        const xhr = new XMLHttpRequest();
        xhr.open("POST", proxyUrl, true);
        xhr.timeout = 30*60*1000; // 30分
        xhr.upload.onprogress = (ev)=>{
          if (ev.lengthComputable) {
            const p = Math.round((ev.loaded/ev.total)*100);
            barFill.style.width = p + "%";
            statusEl.textContent = `アップロード中 ${i+1}/${total} … ${p}%`;
          }
        };
        xhr.onload    = ()=> (xhr.status>=200 && xhr.status<300) ? resolve(JSON.parse(xhr.responseText||"{}")) : reject(new Error("proxy PUT " + xhr.status));
        xhr.ontimeout = ()=> reject(new Error("proxy PUT timeout"));
        xhr.onerror   = ()=> reject(new Error("proxy PUT network error"));
        xhr.send(f);
      });

      // 一時URL 5分
      let presigned = "";
      try{
        const pres = await fetch(`${WORKER_ORIGIN}/files/presign-get`,{
          method:"POST", headers:{ "content-type":"application/json" },
          body: JSON.stringify({ key, expires:PRESIGN_EXPIRES })
        });
        const { url } = await pres.json(); presigned = url || "";
      }catch{}

      // 履歴へ
      addHistory({
        key, name:safeName,
        deleteToken: delInfo?.deleteToken || null,
        deleteUntil: delInfo?.deleteUntil || null,
        createdAt: Date.now(),
        lastPresignUrl: presigned,
        lastPresignAt: Date.now()
      });

      successCount++;
    }catch(e){
      console.error("upload failed:", e);
    }finally{
      done++; statusEl.textContent = `完了 ${done}/${total}`;
    }
  }

  statusEl.textContent = successCount > 0 ? "すべて完了！" : "エラーが発生しました";
  if (successCount === 0) alert("アップロードに失敗しました");
  if (noteEl) noteEl.textContent = "";

  // リセット
  barFill.style.width = "0%";
  try { fileEl.value = ""; } catch {}
  if (fileInfo) fileInfo.textContent = "未選択";
  goBtn.disabled = false; goBtn.textContent = "アップロード開始";
  renderPreUploadList(); 
});

// 外部ブラウザで開く（LIFFがあれば優先、なければ安全フォールバック）
function openExternal(url){
  try{
    if (window.liff && typeof liff.openWindow === "function") {
      liff.openWindow({ url, external: true }); // ← LINE公式の外部遷移
      return;
    }
  }catch(_){/* noop */}

  // LINEの内蔵ブラウザは _blank が通らないことがあるので同タブ遷移に寄せる
  if (/Line\/[\d.]+/i.test(navigator.userAgent)) {
    location.href = url;
    return;
  }

  // 通常ブラウザは _blank、ブロック時は同タブへ
  const w = window.open(url, "_blank");
  if (!w) location.href = url;
}
  
// サイズ表記ヘルパ
function fmtSize(bytes){
  if (bytes >= 1024*1024) return (bytes/1024/1024).toFixed(1) + " MB";
  if (bytes >= 1024)      return (bytes/1024).toFixed(1) + " KB";
  return bytes + " B";
}

// ファイル選択の合計表示を更新
function updateFileInfo() {
  const el = document.getElementById("file");
  const info = document.getElementById("fileinfo");
  if (!el || !info) return;
  const files = el.files || [];
  if (!files.length) { info.textContent = "未選択"; return; }
  let total = 0; for (const f of files) total += f.size || 0;
  info.textContent = `${files.length} 件・合計 ${fmtSize(total)}`;
}

// プレリストを描画
function renderPreUploadList(){
  const el = document.getElementById("file");
  const box = document.getElementById("prelist");
  if (!el || !box) return;
  const files = el.files || [];
  box.innerHTML = "";
  if (!files.length) return;

  Array.from(files).forEach((f, idx) => {
    const row = document.createElement("div");
    row.className = "fitem";

    const left = document.createElement("div");
    left.className = "fleft";

    const name = document.createElement("div");
    name.className = "fname";
    name.textContent = f.name;

    const size = document.createElement("div");
    size.className = "fsize";
    size.textContent = fmtSize(f.size || 0);

    left.appendChild(name);
    left.appendChild(size);

    const del = document.createElement("button");
    del.className = "delbtn";
    del.type = "button";
    del.textContent = "× 削除";
    del.onclick = () => removeFileAt(idx);

    row.appendChild(left);
    row.appendChild(del);
    box.appendChild(row);
  });
}

// 指定 index のファイルを FileList から除去して反映
function removeFileAt(index){
  const el = document.getElementById("file");
  if (!el || !el.files || index == null) return;
  const dt = new DataTransfer();
  Array.from(el.files).forEach((f,i) => { if (i !== index) dt.items.add(f); });
  el.files = dt.files;         // ← FileList を置き換え
  renderPreUploadList();       // 再描画
  updateFileInfo();            // 合計表示も更新
}
/** ===== 初期描画 ===== */
renderHistory();
// 放置中も1分毎に掃除＆再描画
setInterval(()=>{ pruneHistoryExpired(); renderHistory(); }, 60*1000);
</script>
