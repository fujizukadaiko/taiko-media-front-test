<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>アップロード｜Taiko Media</title>
<meta name="theme-color" content="#0a0b11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<script src="https://unpkg.com/exifr/dist/full.umd.js"></script>
<style>
  :root{
    /* ── 抹茶テーマ ───────────────────────── */
    --brand:#c1d8ac;         /* 裏葉柳（主カラー） */
    --brand-d:#a9c890;       /* 濃いめ（押下/枠線など） */
    --bgpage:#d6e9ca;        /* うっすい白緑（ページ地） */
    --panel:#ffffff;         /* カード背景は白 */
    --text:#1e2a1e;          /* 文字色は濃い緑がかった黒 */
    --muted:#6f7f6a;         /* サブ文字（やや薄） */
    --border:#e6eedc;        /* カード枠の薄い緑 */
    --accent:#c1d8ac;        /* 既存ボタン兼用（brandと揃える） */
    --accent-2:#86c4a0;      /* プログレス/補助色（柔らかミント） */
  }
  
  *{box-sizing:border-box}
  html,body{height:100%}
  
  /* ページの地はうっすい白緑 */
  html{background:var(--bgpage)}
  body{
    margin:0;
    min-height:100svh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:var(--bgpage);
    color:var(--text);
    font:16px/1.6 system-ui, -apple-system, "Segoe UI", Arial;
  }
  
  /* ヘッダ/カードは白ベースに */
  .topbar{
    display:flex;gap:12px;align-items:center;justify-content:space-between;
    background:#fff;
    border:1px solid var(--border);
    padding:14px 16px;border-radius:16px;margin:12px 0 20px;
    box-shadow:0 8px 28px rgba(0,0,0,.04);
  }
  .sub{display:none} /* B2説明は非表示 */
  
  .box{
    background:var(--panel); border:1px solid var(--border);
    max-width:860px; margin:0 auto; padding:18px; border-radius:16px;
    box-shadow:0 10px 32px rgba(0,0,0,.06);
  }
  
  /* ファイル選択ボタン（枠＝主カラー） */
  .filebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type="file"]{display:none}
  .filebtn{
    background:#fff;border:2px solid var(--brand);color:var(--text);
    padding:14px;border-radius:14px;cursor:pointer;
    box-shadow:0 2px 0 0 var(--brand-d) inset;
  }
  .filebtn:hover{filter:brightness(1.02)}
  .fileinfo{color:var(--muted);font-size:13px}
  
  /* アップロード開始ボタン＝横長（画面幅に収まる） */
  .btn{
    background:var(--brand);color:#102010;border:none;
    padding:14px 16px;border-radius:12px;cursor:pointer;
  }
  #go{
    width:100%;
    max-width:680px;           /* 画面幅より少し狭く */
    display:block;
    margin:0 auto;
    font-size:16px;
    font-weight:600;
  }
  .btn.ghost{background:#f7fbf3;color:var(--text);border:1px solid var(--border)}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:999px}
  .btn:active{transform:translateY(1px)}
  
  /* 進捗バー：ボタンにくっつかないように余白 */
  #bar{
    width:100%;height:12px;background:#f0f6e8;border:1px solid var(--border);
    border-radius:999px;overflow:hidden;
    margin-top:12px;           /* ← 余白を追加 */
  }
  #bar>div{height:100%;width:0;background:var(--accent-2);transition:width .15s linear}
  
  /* 履歴表示 */
  .item-row{padding:12px 0;border-bottom:1px dashed #dfead4}
  .hist-name{font-size:14px;line-height:1.4;color:#406040}
  .hist-name:hover{text-decoration:underline}
  .item-row.cancelled{opacity:.55;filter:grayscale(.15)}
  .status-cancelled{
    display:inline-block;margin-left:8px;padding:3px 8px;border-radius:999px;
    background:#f3f7ef;color:#6f7f6a;border:1px solid var(--border);font-size:12px;
  }
  .row-actions{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .row-actions .pill{
    display:flex;align-items:center;gap:10px;padding:8px 10px;
    border:1px solid var(--border);border-radius:999px;background:#f7fbf3;color:var(--text);
  }
  @media (max-width:600px){
    .btn{width:100%}
    .row-actions .btn{width:auto}
    .row-actions .btn.small{padding:8px 12px}
  }
  
  /* フッター：中央・小さく・薄く */
  footer{
    color:#94a38f;             /* 薄め */
    font-size:11px;            /* 小さく */
    margin:28px 0;
    text-align:center;         /* 中央揃え */
  }
  .hist-title { margin:16px 0 6px; font-size:16px }
  .hist-title .note { font-size:12px; color:var(--muted); margin-left:6px }
  
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div class="brand">
      <h1>アップロード</h1>
    </div>
    <div class="right">
      <button class="btn ghost" id="howto">使い方</button>
    </div>
  </header>

  <section class="box">
    <div class="row filebox">
      <label class="filebtn" for="file">ファイルを選ぶ（画像/動画・複数可）</label>
      <input id="file" type="file" accept="image/*,video/*" multiple />
      <span class="fileinfo" id="fileinfo">未選択</span>
    </div>

    <div class="row">
      <button class="btn" id="go">アップロード開始</button>
    </div>

    <div class="row">
      <div id="bar"><div></div></div>
      <div id="status" style="margin-top:8px;color:#cfd4e1"></div>
    </div>

    <div class="row" id="history-block">
      <h3 class="hist-title">アップロード履歴 <span class="note">（一時URLは約5分）</span></h3>
      <div id="result"></div>
    </div>
  </section>

  <footer id="copyright"></footer>
  <script>
    // 初出年を必要に応じて変更
    const FIRST_YEAR = 1996;
    const y = new Date().getFullYear();
    const range = (y === FIRST_YEAR) ? `${y}` : `${FIRST_YEAR}–${y}`;
    // 実際の権利者名に置き換えてください
    const holder = "藤塚太鼓";
    document.getElementById("copyright").textContent = `© ${range} ${holder}`;
  </script>
</div>

<script>
/** ===== 設定（ここだけ変更） ===== */
const WORKER_ORIGIN = "https://taiko-worker-plain.fujizukadaiko.workers.dev";  // 例: https://taiko-worker-plain.xxx.workers.dev
const MAX_FILE_MB = 2048;
const PRESIGN_EXPIRES = 300;       // 一時URL 5分
const SELF_DELETE_TTL_SEC = 30*60; // 30分（参考表示用）
const LS_KEY = "tm/uploads/v1";    // ローカル履歴のキー
const CANCELLED_KEEP_MS = 6 * 60 * 60 * 1000;// 取り消し済みの履歴をどれくらい残すか（ミリ秒）
// 例: 24時間 = 24 * 60 * 60 * 1000

/** ===== 便利関数 ===== */
const $  = (s,p=document)=>p.querySelector(s);
const pad2 = (n)=> String(n).padStart(2,"0");
function ymdSegments(d=new Date()){
  const Y=d.getFullYear(), M=pad2(d.getMonth()+1), D=pad2(d.getDate());
  return { y:`${Y}`, ym:`${Y}${M}`, ymd:`${Y}${M}${D}` };
}
async function detectTakenAt(file){
  try{
    if (/\.(jpe?g|heic|heif|webp|tiff?)$/i.test(file.name)) {
      const exif = await exifr.parse(file, { userComment:false });
      const d = exif?.DateTimeOriginal || exif?.CreateDate || exif?.ModifyDate;
      if (d instanceof Date && !isNaN(+d)) return { at:d, source:"exif" };
    }
  }catch(e){ console.warn("EXIF parse failed:", e); }
  return { at: file.lastModified ? new Date(file.lastModified) : new Date(), source:"lastModified" };
}

/** ===== 履歴の保存・描画 ===== */
function loadHistory(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch{ return []; } }
function saveHistory(list){ localStorage.setItem(LS_KEY, JSON.stringify(list.slice(-200))); }
function addHistory(entry){ const list = loadHistory(); list.push(entry); saveHistory(list); renderHistory(); }
function fmtRemain(ms){
  if (ms<=0) return "期限切れ";
  const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
  return `${m}分${pad2(s)}秒`;
}
async function reissueUrl(item, btn){
  // 視覚フィードバック & 連打防止
  if (btn) {
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    btn._prevText = btn.textContent;
    btn.textContent = '発行中…';
  }

  try {
    const res = await fetch(`${WORKER_ORIGIN}/files/presign-get`, {
      method: "POST",
      headers: { "content-type":"application/json" },
      body: JSON.stringify({ key: item.key, expires: PRESIGN_EXPIRES })
    });
    if (!res.ok) throw new Error(`presign-get ${res.status}`);
    const { url } = await res.json();

    // localStorage 更新
    item.lastPresignUrl = url || "";
    item.lastPresignAt  = Date.now();
    const list = loadHistory();
    const idx  = list.findIndex(x => x.key === item.key);
    if (idx >= 0) { list[idx] = item; saveHistory(list); }

    // ★ ここでは再描画しない（ボタン表示を維持）
    // ★ 成功時にURLを返す
    const updatedUrl = item.lastPresignUrl || "";
    
    if (btn) {
      btn.textContent = '発行済み ✓';
      btn.setAttribute('aria-busy', 'false');
      setTimeout(() => {
        btn.textContent = btn._prevText || '再発行';
        btn.disabled = false;
        renderHistory();
      }, 1200);
    } else {
      renderHistory();
    }
    return updatedUrl;   // ← これを追加
  } catch (e) {
    console.error(e);
    if (btn) {
      btn.textContent = '失敗…再試行';
      btn.disabled = false;
      btn.setAttribute('aria-busy', 'false');
    }
    return null;
  }
}
function renderHistory(){
  pruneHistoryExpired();
  const list = loadHistory().slice().reverse();
  const box = $("#result");
  box.innerHTML = "";
  for (const item of list){
    const row = document.createElement("div");
    row.className = "item-row" + (item.cancelled ? " cancelled" : "");

    const link = document.createElement("a");
    link.className = "hist-name";
    link.textContent = `アップロード完了：${item.name}`;
    
    const isExpired = () => {
      if (!item.lastPresignUrl || !item.lastPresignAt) return true;
      const age = Date.now() - item.lastPresignAt;
      // ちょい余裕（2秒）を引く
      return age >= (PRESIGN_EXPIRES * 1000 - 2000);
    };
    
    if (item.cancelled || !item.lastPresignUrl){
      link.href = "#";
      link.classList.add("name-cancelled");
    } else {
      link.href = item.lastPresignUrl;
      link.target = "_blank";
    }
    
     // 期限切れなら再発行を促す
    link.onclick = async (e) => {
      if (item.cancelled) { e.preventDefault(); return; }
      if (!item.lastPresignUrl || isExpired()) {
        e.preventDefault();
        const go = confirm("この一時URLは有効期限が切れています。新しいURLを再発行しますか？");
        if (!go) return;
    
        const newUrl = await reissueUrl(item, null);
        if (newUrl) {
          // その場のリンクも更新しておく
          link.href = newUrl;
          link.target = "_blank";
          link.classList.remove("name-cancelled");
          window.open(newUrl, "_blank");
        }
      }
    };
    row.appendChild(link);

    if (item.cancelled){
      const tag = document.createElement("span");
      tag.className = "status-cancelled";
      tag.textContent = "取り消し済み";
      row.appendChild(tag);
    }

    const actions = document.createElement("div");
    actions.className = "row-actions";

    if (!item.cancelled){
      const btnRe = document.createElement("button");
      btnRe.className = "btn small ghost";
      btnRe.textContent = "再発行";
      btnRe.onclick = (e)=> reissueUrl(item, e.currentTarget);
      actions.appendChild(btnRe);

      if (item.deleteToken && item.deleteUntil){
        const pill = document.createElement("span");
        pill.className = "pill";
      
        const btnDel = document.createElement("button");
        btnDel.className = "btn small";
        btnDel.style.background = "var(--accent-2)";
        btnDel.style.color = "#0b0c10";
        btnDel.textContent = "取り消す";
      
        const remainSpan = document.createElement("span");
      
        // ★ 先に宣言しておく（TDZ回避）
        let timerId = null;
      
        const updateRemain = ()=>{
          const ms = new Date(item.deleteUntil).getTime() - Date.now();
          if (ms <= 0){
            remainSpan.textContent = "期限切れ";
            if (timerId) { clearInterval(timerId); timerId = null; }
            // 少しだけ待って（UIが「期限切れ」と見えるようにしてから）履歴から除去
            setTimeout(() => removeHistoryByKey(item.key), 800);
            return;
          }
          remainSpan.textContent = `残り ${fmtRemain(ms)}`;
        };
      
        updateRemain();
        timerId = setInterval(updateRemain, 1000);
      
        btnDel.onclick = async ()=>{
          if (!confirm("このファイルを取り消します。よろしいですか？")) return;
          const res = await fetch(`${WORKER_ORIGIN}/files/self-delete`,{
            method:"POST",
            headers:{ "content-type":"application/json" },
            body: JSON.stringify({ token:item.deleteToken })
          });
          const js = await res.json().catch(()=>({}));
          if (res.ok && js.ok){
            if (timerId) { clearInterval(timerId); timerId = null; }
            item.cancelled = true;
            item.cancelledAt = Date.now();
            item.lastPresignUrl = "";
            const all = loadHistory().map(x => x.key===item.key ? item : x);
            saveHistory(all);
            renderHistory();
          }else{
            alert("取り消しに失敗しました");
          }
        };
      
        pill.appendChild(btnDel);
        pill.appendChild(remainSpan);
        actions.appendChild(pill);
      }
    }

    row.appendChild(actions);
    box.appendChild(row);
  }
}
  // 起動時に一度描画
renderHistory();

// 放置中も1分毎に掃除＆再描画
setInterval(() => { pruneHistoryExpired(); renderHistory(); }, 60 * 1000);
// 履歴：期限切れ(未キャンセル)を掃除
function pruneHistoryExpired(){
  const now = Date.now();
  const list = loadHistory();

  const kept = list.filter(it => {
    // ① 取り消しトークンの期限切れ（未キャンセルの場合は除外する＝消す）
    if (it.deleteUntil && !it.cancelled) {
      const expired = new Date(it.deleteUntil).getTime() <= now;
      if (expired) return false; // 履歴から消す
    }

    // ② 取り消し済みで、一定時間を超えたら除外する
    if (it.cancelled && it.cancelledAt) {
      const age = now - it.cancelledAt;
      if (age >= CANCELLED_KEEP_MS) return false; // 履歴から消す
    }

    return true; // 残す
  });

  if (kept.length !== list.length) saveHistory(kept);
}
function removeHistoryByKey(key){
  const kept = loadHistory().filter(x => x.key !== key);
  saveHistory(kept);
  renderHistory();
}
/** ===== 使い方 ===== */
$("#howto").addEventListener("click", ()=>{
  alert([
    "① 画像/動画を選択（複数可）",
    "② 「アップロード開始」",
    "③ 一覧に結果が残ります（再読み込みしてもOK）",
    "・一時URLは5分。必要なら「再発行」を押してください",
    "・誤アップは30分以内なら「取り消す」で自己撤回できます"
  ].join("\n"));
});

/** ===== ファイル選択表示 ===== */
$("#file").addEventListener("change", () => {
  const f = $("#file").files;
  if (!f || !f.length) return $("#fileinfo").textContent = "未選択";
  let total = 0; for (const x of f) total += x.size||0;
  $("#fileinfo").textContent = `${f.length} 件・合計 ${(total/1024/1024).toFixed(1)} MB`;
});

/** ===== メイン：アップロード ===== */
document.getElementById("go").onclick = async () => {
  if (!/^https?:\/\//.test(WORKER_ORIGIN)) { alert("Worker URL が不正です"); return; }

  const fileEl   = document.getElementById("file");
  const files    = fileEl.files;
  if (!files.length) return alert("ファイルを選んでください。");

  const barFill  = document.querySelector("#bar > div");
  const statusEl = document.getElementById("status");
  const fileInfo = document.getElementById("fileinfo");
  const goBtn    = document.getElementById("go");

  // UI初期化
  statusEl.textContent = "";
  barFill.style.width  = "0%";
  goBtn.disabled = true;
  goBtn.textContent = "アップロード中…";

  const total = files.length;
  let done = 0;
  let successCount = 0;

  for (let i = 0; i < total; i++) {
    const f = files[i];

    try {
      if (f.size > MAX_FILE_MB * 1024 * 1024) {
        alert(`${f.name} は ${MAX_FILE_MB}MB を超えています`);
        continue;
      }

      statusEl.textContent = `アップロード中 ${i+1}/${total} … 0%`;

      // 撮影日時から key を構成
      const { at: takenAt } = await detectTakenAt(f);
      const { ym, ymd } = ymdSegments(takenAt);
      const rand     = Math.random().toString(36).slice(2,8);
      const safeName = f.name.replace(/[^\w.\-]/g, "_");
      const hh = pad2(takenAt.getHours()), mm = pad2(takenAt.getMinutes()), ss = pad2(takenAt.getSeconds());
      const timeSlug = `${hh}${mm}${ss}`;
      const key = `staging/${ym}/${ymd}/${timeSlug}_${rand}_${safeName}`;
      const contentType = f.type || "application/octet-stream";

      // 代理PUT
      const proxyUrl = `${WORKER_ORIGIN}/uploads/proxy-put?key=${encodeURIComponent(key)}&contentType=${encodeURIComponent(contentType)}`;
      const delInfo = await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", proxyUrl, true);
        xhr.timeout = 5 * 60 * 1000;
        xhr.upload.onprogress = (ev) => {
          if (ev.lengthComputable) {
            const p = Math.round((ev.loaded / ev.total) * 100);
            barFill.style.width = p + "%";
            statusEl.textContent = `アップロード中 ${i+1}/${total} … ${p}%`;
          }
        };
        xhr.onload    = () => { (xhr.status>=200 && xhr.status<300)
                                ? resolve(JSON.parse(xhr.responseText || "{}"))
                                : reject(new Error("proxy PUT " + xhr.status)); };
        xhr.ontimeout = () => reject(new Error("proxy PUT timeout"));
        xhr.onerror   = () => reject(new Error("proxy PUT network error"));
        xhr.send(f);
      });

      // 一時URL 5分
      let presigned = "";
      try {
        const pres = await fetch(`${WORKER_ORIGIN}/files/presign-get`, {
          method: "POST",
          headers: { "content-type":"application/json" },
          body: JSON.stringify({ key, expires: PRESIGN_EXPIRES })
        });
        const { url } = await pres.json();
        presigned = url || "";
      } catch {}

      // 履歴へ
      addHistory({
        key, name: safeName,
        deleteToken: delInfo?.deleteToken || null,
        deleteUntil: delInfo?.deleteUntil || null,
        createdAt: Date.now(),
        lastPresignUrl: presigned,
        lastPresignAt: Date.now()
      });

      successCount++;
    } catch (e) {
      console.error("upload failed:", e);
      // ここでは落とさない（次のファイルへ）
    } finally {
      done++;
      statusEl.textContent = `完了 ${done}/${total}`;
    }
  }

  // すべてのファイル処理が終わったら、状態を整える
  if (successCount > 0) {
    statusEl.textContent = "すべて完了！";
  } else {
    statusEl.textContent = "エラーが発生しました";
    alert("アップロードに失敗しました");  // 全滅時のみ
  }

  // 進捗と選択をリセット
  barFill.style.width = "0%";
  try { fileEl.value = ""; } catch {}
  if (fileInfo) fileInfo.textContent = "未選択";

  // ボタン復帰
  goBtn.disabled = false;
  goBtn.textContent = "アップロード開始";
};

/** 初期描画（保存済み履歴を表示） */
renderHistory();
</script>
</body>
</html>
