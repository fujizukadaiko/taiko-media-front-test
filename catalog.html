<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>カタログ｜藤塚太鼓</title>
<style>
:root{
  --brand:#c1d8ac;
  --brand-d:#a9c890;
  --bgpage:#ebf6f7;
  --panel:#ffffff;
  --text:#1e2a1e;
  --muted:#6f7f6a;
  --border:#e6eedc;
  --chip:#f7fbf3;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bgpage);
  color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial;
}
.container{max-width:1100px;margin:24px auto;padding:0 16px}

/* ── ヘッダ ── */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--panel); border:1px solid var(--border);
  padding:14px 16px; border-radius:16px; margin:12px 0 16px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}
.brand h1{font-size:clamp(18px,3.8vw,22px);margin:0;}
  .brand{
  display:flex;
  flex-direction:column;
  gap:2px;
  flex:1;
  min-width:0;   /* ★ これがないと中身が縮んでくれない */
}
.topbar .right{display:flex;align-items:center;gap:8px;}
a.btn,button.btn{
  background:var(--brand); color:#102010;
  border:1px solid var(--brand-d);
  padding:8px 14px; border-radius:10px;
  text-decoration:none; cursor:pointer; font-size:14px;
}
a.btn.ghost,button.btn.ghost{
  background:var(--chip); color:var(--text);
  border:1px solid var(--border);
}
a.btn:hover,button.btn:hover{filter:brightness(1.03);}
a.btn:active,button.btn:active{transform:translateY(1px);}
a.btn:disabled,button.btn:disabled{opacity:.6;cursor:not-allowed;}

/* ── フィルタ行 ── */
.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 18px;
  flex-wrap:wrap;          /* ★ ボタンが下の行に逃げられるように */
}
.controls select{
  flex:1;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff; color:var(--text);
  font-size:15px;

  min-width:0;              /* ★ これがないと縮まってくれない */
  max-width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;   /* ★ 長いとき「…」で省略 */
}
.controls button.btn{
  white-space:nowrap;
}
.controls input[type="text"]{
  flex:1;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  font-size:15px;
}
/* ==== 選択モード / 選択状態の見た目 ==== */
/* 選択モードボタン：ON のとき濃い色に */
#toggleSelectMode.btn-on{
  background: var(--brand-d);
  color:#ffffff;
  border-color: var(--brand-d);
}

#toggleSelectMode.btn-on:hover{
  filter:brightness(1.05);
}
.select-hint{
  font-size:12px;
  color:var(--muted);
  margin:4px 0 10px;
}
/* カードが選択されているときの枠＆光り方 */
.card.selected{
  border-color: var(--brand-d);
  box-shadow: 0 0 0 2px rgba(161, 212, 221, 0.7);
}

/* チェックボックスを丸く・大きめにする */
.card-check{
  width: 20px;
  height: 20px;
  appearance: none;
  -webkit-appearance: none;
  border-radius: 999px;
  border: 2px solid var(--border);
  background: #fff;
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color .15s, background-color .15s;
}

.card-check::after{
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: var(--brand);
  opacity: 0;
  transition: opacity .15s;
}

.card-check:checked{
  border-color: var(--brand-d);
  background: #f0faf4;
}

.card-check:checked::after{
  opacity: 1;
}

/* 選択モードじゃないときはチェックを薄く＆操作不可にする */
body:not(.select-mode) .card-check{
  opacity: 0;
  pointer-events: none;
}

/* 選択モードのときは見えるように */
body.select-mode .card-check{
  opacity: 1;
  pointer-events: auto;
}

/* カード全体が選択可能っぽく見えるように（選択モード中のみ） */
body.select-mode .card{
  cursor: pointer;
}
body.select-mode .card button{
  cursor: pointer;
}
/* ── グリッド ── */
.grid{
  display:grid;
  /* PC では 230px 幅を目安に自動で 3〜4 列 */
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:14px;
}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}
.thumb{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  background:#f2f6ee;
}
.meta{padding:12px 14px;}
.title{
  font-size:14px;
  margin:0 0 8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#2c3d2c;
}
.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.badge{
  font-size:11px;
  color:var(--muted);
  background:var(--chip);
  border:1px solid var(--border);
  padding:4px 8px;
  border-radius:999px;
}

/* ボタンを常に縦2段にする */
.actions{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:10px;
}
.actions button{
  width:100%;
  text-align:center;
  font-size:13px;
  padding:10px 12px;
  border-radius:12px;
}
.view{
  background:var(--chip);
  color:var(--text);
  border:1px solid var(--border);
}

/* サブタイトル（ヘッダの2行目） */
.folder-header{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block;
  max-width:100%;
}

/* ==== モバイル用レイアウト調整 ==== */
@media (max-width: 768px){
  /* サムネを2列にする */
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .card{
    border-radius:12px;
  }
  .meta{
    padding:8px 10px;
  }
  .title{
    font-size:12px;
  }

  /* フィルタ行：1段目にプルダウンをフル幅で置く */
  .controls{
    flex-wrap:wrap;
  }
  .controls select{
    flex-basis:100%;  /* 1行占有して幅いっぱい */
  }
}

  /* ==== プレビュー用モーダル調整 ==== */
dialog#viewer {
  border: none;
  padding: 0;
  max-width: min(900px, 95vw);  /* PC でもスマホでもはみ出さない */
  width: 95vw;
  max-height: 90vh;             /* 画面からはみ出さない */
  margin: auto;
  border-radius: 16px;
  overflow: hidden;
  background: #ffffff;
}

dialog#viewer::backdrop {
  background: rgba(0, 0, 0, 0.45); /* うっすら暗くする */
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  font-size: 14px;
}

.modal-head strong {
  font-size: 13px;
  font-weight: 600;
  max-width: 70%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.modal-head button {
  border:none;
  background:transparent;
  padding:4px 8px;
  border-radius:0;
  font-size:18px;
  line-height:1;
  cursor:pointer;
}

.modal-body {
  padding: 10px 14px 16px;
  background: #fafdf9;
}

/* 中身の画像 / 動画は「枠内に収まる」＆「引き伸ばしすぎない」 */
#v-container {
  display: flex;
  justify-content: center;
  align-items: center;
}

#v-container img,
#v-container video {
  max-width: 100%;
  max-height: 70vh;   /* 画面高さの 70% まで */
  width: auto;
  height: auto;
  object-fit: contain; /* 収まり優先でトリミングしない */
  border-radius: 10px;
  background: #000;    /* 動画や縦長画像の余白が黒背景になる */
}

/* スマホだと少し縦を広めに使う */
@media (max-width: 600px) {
  dialog#viewer {
    width: 96vw;
    max-width: 96vw;
    max-height: 90vh;
  }
  #v-container img,
  #v-container video {
    max-height: 75vh;
  }
}
  /* ==== ZIP作成ダイアログ ==== */
#zipDialog {
  border: none;
  padding: 0;
  max-width: min(420px, 95vw);
  width: 95vw;
  margin: auto;
  border-radius: 16px;
  overflow: hidden;
  background: #ffffff;
}

#zipDialog::backdrop {
  background: rgba(0, 0, 0, 0.45);
}

.zip-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}

.zip-bar {
  flex: 1;
  height: 10px;
  border-radius: 999px;
  background: #e6eef2;
  overflow: hidden;
}

#zipBarFill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: var(--brand-d);
  transition: width 0.15s linear;
}

.zip-progress-text {
  font-size: 12px;
  color: var(--muted);
}
  /* タグ行：1列でボタンを置くだけ */
.controls-tags {
  margin-bottom: 10px;
}

.controls-tags .btn {
  width: 100%;
}

/* 選択行：左に DL ボタン、その右に選択モードボタン */
.controls-select {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  justify-content:flex-start; /* 左寄せ */
}
.controls-select .controls-left,
.controls-select .controls-right{
  display:flex;
  align-items:center;
  gap:8px;
}

/* 3段目：ヒント or 全選択/全解除 */
.select-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:4px 0 12px;
}
.select-hint{
  font-size:12px;
  color:var(--muted);
  margin:0;
}
.select-actions{
  display:none;          /* 選択モードONで flex に切り替え */
  gap:8px;
}
.select-actions .btn,
button.btn.small{
  font-size:12px;
  padding:6px 10px;
}

/* スマホでは折り返しOK */
@media (max-width: 768px) {
  .controls-select{
    flex-wrap:wrap;
  }
  .select-row{
    flex-wrap:wrap;
  }
}
  button.btn[disabled] {
  opacity: .4;
  cursor: default;
  box-shadow: none;
}
  /* ==== タグ絞り込みモーダル ==== */
dialog#tagDialog {
  border:none;
  padding:0;
  max-width:min(520px, 95vw);
  width:95vw;
  margin:auto;
  border-radius:16px;
  overflow:hidden;
  background:#ffffff;
}

dialog#tagDialog::backdrop {
  background:rgba(0,0,0,0.45);
}

.tag-body{
  padding:10px 14px 16px;
  background:#fafdf9;
  font-size:14px;
}

.tag-help{
  margin:0 0 8px;
  color:var(--muted);
  font-size:13px;
}

.tag-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:8px 0 12px;
}

.tag-chip{
  font-size:13px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--chip);
  color:var(--text);
  cursor:pointer;
}

.tag-chip.active{
  background:var(--brand);
  border-color:var(--brand-d);
  color:#102010;
}

.tag-footer{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:4px;
}
  
/* 画面切り替え用 */
.view{
  display:none;
}
.view.view-active{
  display:block;
}
  
/* フッター */
footer{
  color:#94a38f; font-size:11px; margin:28px 0; text-align:center;
}
</style>
</head>

<body>
  <div class="container">

    <!-- ▼▼ フォルダ選択ビュー ▼▼ -->
    <section id="view-folder-list" class="view view-active">
      <!-- ここは後で実装。今は仮のヘッダだけ置いといてOK -->
      <header class="topbar">
        <div class="brand">
          <h1>フォルダ選択</h1>
          <div class="folder-header">見たいイベントのフォルダを選んでください</div>
        </div>
      </header>

      <!-- ここにフォルダ一覧カードをあとで作る -->
      <div id="folderList"></div>
    </section>
    <!-- ▲▲ フォルダ選択ビュー ▲▲ -->

    <!-- ▼▼ カタログビュー ▼▼ -->
    <section id="view-catalog" class="view">
      <header class="topbar">
        <div class="brand">
          <h1>カタログ</h1>
          <div id="folderHeader" class="folder-header"></div>
        </div>
        <div class="right">
          <button id="toFolderList"
                  class="btn ghost"
                  type="button"
                  data-view-target="view-folder-list">
            フォルダ選択画面へ
          </button>
        </div>
      </header>

      <!-- タグ検索ボタン -->
      <div class="controls controls-tags">
        <button id="tagFilterOpen" class="btn ghost" style="width:100%;">
          タグで絞り込む
        </button>
      </div>

      <!-- 2段目：DL＋選択モード -->
      <div class="controls controls-select">
        <div class="controls-left">
          <button id="bulkDownload" class="btn" disabled>ダウンロード (0)</button>
        </div>
        <div class="controls-right">
          <button id="toggleSelectMode" class="btn ghost">選択モード OFF</button>
        </div>
      </div>

      <!-- 3段目：ヒント or 全選択 / 全解除 -->
      <div class="select-row">
        <p id="selectHint" class="select-hint">
          写真を選択してダウンロードできます
        </p>
        <div id="selectActions" class="select-actions">
          <button id="selectAll" class="btn ghost small">全選択</button>
          <button id="clearSelection" class="btn ghost small">全解除</button>
        </div>
      </div>

      <div id="grid" class="grid"></div>
    </section>
    <!-- ▲▲ カタログビュー ▲▲ -->

    <footer id="copyright"></footer>
  </div>

  <!-- プレビュー用ダイアログ -->
  <dialog id="viewer">
    <div class="modal-head">
      <strong id="v-title"></strong>
      <button id="v-close" aria-label="閉じる">×</button>
    </div>
    <div class="modal-body">
      <div id="v-container"></div>
    </div>
  </dialog>

  <!-- ZIP ダイアログ -->
  <dialog id="zipDialog">
    <div class="modal-head">
      <strong id="zipTitle">ZIP作成中…</strong>
    </div>
    <div class="modal-body">
      <p id="zipStatus" style="margin: 0 0 8px; font-size: 13px;">
        サーバーでZIPファイルを作成しています…
      </p>
      <div class="zip-progress">
        <div class="zip-bar">
          <div id="zipBarFill"></div>
        </div>
        <div id="zipProgressText" class="zip-progress-text">0%</div>
      </div>
    </div>
  </dialog>

  <!-- タグ絞り込みモーダル -->
  <dialog id="tagDialog">
    <div class="modal-head">
      <strong>タグで絞り込む</strong>
      <button id="tagDialogClose" aria-label="閉じる">×</button>
    </div>
    <div class="modal-body tag-body">
      <p class="tag-help">見たいタグを選んでください（複数選択できます）</p>
      <div id="tagList" class="tag-list"></div>
      <div class="tag-footer">
        <button id="tagClear" class="btn ghost">選択をクリア</button>
        <button id="tagApply" class="btn">この条件で絞り込む</button>
      </div>
    </div>
  </dialog>

  <script>
    // copyright 用（ここは元のままでOK）
    const FIRST_YEAR = 1996;
    const y = new Date().getFullYear();
    const range = (y === FIRST_YEAR) ? `${y}` : `${FIRST_YEAR}–${y}`;
    const holder = "藤塚太鼓";
    document.getElementById("copyright").textContent = `© ${range} ${holder}`;
  </script>

<script>
/* ===== 設定 ===== */
const CONFIG = {
  WORKER_ORIGIN: "https://taiko-worker-plain.fujizukadaiko.workers.dev",
  INDEX_URL: "https://taiko-worker-plain.fujizukadaiko.workers.dev/catalog/index",
  PRESIGN_EXPIRES: 300,
  UPLOAD_URL: "https://fujizukadaiko.github.io/taiko-media-front-test/index.html",
  FOLDER_LIST_URL: "https://fujizukadaiko.github.io/taiko-media-front-test/folders.html" // トップ画面（フォルダ一覧）のURLに合わせて変更
};

/* ===== 便利関数 ===== */
const $ = (s,p=document)=>p.querySelector(s);
const el = (t,props={}) => Object.assign(document.createElement(t), props);
const joinPath = (base, path) => base.replace(/\/+$/,"") + path;
const isVideo = (name='') => /\.(mp4|mov|webm|m4v)$/i.test(name);

/** manifest が "/catalog?..." みたいなパスでも
 *  "https://...workers.dev/catalog?..." に直すヘルパー
 */
function toWorkerUrl(pathOrUrl) {
  if (!pathOrUrl) return "";
  // すでに http(s) から始まるならそのまま
  if (/^https?:\/\//.test(pathOrUrl)) return pathOrUrl;
  // 先頭が "/" などの相対パス → WORKER_ORIGIN を前にくっつける
  return joinPath(CONFIG.WORKER_ORIGIN, pathOrUrl);
}
  
/* ===== 状態 ===== */
let currentManifestUrl = "";
let currentItems = [];
let currentFolderNasLink = null;   // ★ 追加：NASリンク（今は null のままでもOK）
const selectedKeys = new Set();
// ★ 追加：現在選択中フォルダのメタ情報
let currentFolderMeta = {
  date: null,
  title: "",
  place: null,
  note: null,
};

// ★ 追加：選択モード ON/OFF
let selectionMode = false;

let allTags = [];             // すべてのタグ一覧
let selectedTagFilters = [];  // モーダルで選ばれているタグ

/* ===== 画面切り替え（view） ===== */
function switchView(targetId){
  document.querySelectorAll(".view").forEach(v => {
    v.classList.toggle("view-active", v.id === targetId);
  });
}
  
/* ===== フォルダ一覧読み込み → セレクタへ反映 ===== */
async function loadFolderIndex(){
  const res = await fetch(CONFIG.INDEX_URL);
  console.log("[index] url=", CONFIG.INDEX_URL, "status=", res.status);
  if (!res.ok) throw new Error("index fetch failed");
  const { folders = [] } = await res.json();

  if (!folders.length) return;

  // もし将来また <select id="folderSelect"> を復活させたときのために、一応対応は残す
  const sel = document.getElementById("folderSelect");
  if (sel) {
    sel.innerHTML = "";
    for (const f of folders){
      const manifestUrl = toWorkerUrl(f.manifest);
      const opt = el("option", {
        value: manifestUrl,
        textContent: f.title ? `${f.date}｜${f.title}` : f.date
      });
      sel.appendChild(opt);
    }
  }

  // ★ 初期表示：1件目のフォルダを読み込む
  const firstManifest = toWorkerUrl(folders[0].manifest);
  currentManifestUrl = firstManifest;
  await renderFolder(currentManifestUrl);

  // セレクトがある環境なら onChange も設定
  if (sel) {
    sel.value = firstManifest;
    sel.onchange = async () => {
      selectedKeys.clear();
      updateBulkButton();
      currentManifestUrl = sel.value;
      await renderFolder(currentManifestUrl);
    };
  }
}

/* ===== グリッド描画 共通関数 ===== */
function renderGrid(items, folderNasLink){
  // 状態を更新
  currentItems = items || [];
  const grid = $("#grid");
  grid.innerHTML = "";

  // 選択状態は一旦リセットしない（モードOFFでclear済み）
  updateBulkButton();
  updateSelectButtonsState();

  if (folderNasLink && /^https?:\/\//.test(folderNasLink)){
    const bar = el("div", {
      className: "card",
      style: "padding:12px;border:1px dashed var(--border);background:#fff"
    });
    const a = el("a", {
      href: folderNasLink,
      target: "_blank",
      textContent: "フォルダごとダウンロード（NAS共有）"
    });
    bar.appendChild(a);
    grid.appendChild(bar);
  }

  for (const item of currentItems){
    const card = el("div", { className: "card" });

    // このカードの選択状態をまとめて更新する関数
    const setSelected = (on) => {
      if (on) {
        selectedKeys.add(item.key);
      } else {
        selectedKeys.delete(item.key);
      }
      chk.checked = on;
      card.classList.toggle("selected", on);
      updateBulkButton();
      updateSelectButtonsState();
    };

    const chkWrap = el("div", {
      style: "display:flex;align-items:center;gap:8px;padding:10px 12px"
    });
    const chk = el("input", {
      type: "checkbox",
      className: "card-check"
    });

    // チェックボックス直接操作
    chk.onchange = () => {
      setSelected(chk.checked);
    };

    const label = el("div", { style: "flex:1" });

    const title = el("div", {
      className: "title",
      textContent: item.title || (item.key?.split("/").pop() || "")
    });

    const badges = el("div", { className: "badges" });

    const kind = isVideo(item.key) ? "video" : "image";
    const kindBadge = el("span", {
      className: "badge",
      textContent: kind
    });
    if (kind === "video"){
      kindBadge.style.color = "#2d5560";
      kindBadge.style.background = "#eef8fb";
    } else {
      kindBadge.style.color = "#47644a";
      kindBadge.style.background = "#f2f7f1";
    }
    badges.appendChild(kindBadge);

    if (Array.isArray(item.tags)){
      for (const tagName of item.tags){
        const tagBadge = el("span", {
          className: "badge",
          textContent: tagName
        });
        badges.appendChild(tagBadge);
      }
    }

    label.appendChild(title);
    label.appendChild(badges);
    chkWrap.appendChild(chk);
    chkWrap.appendChild(label);

    const img = el("img", {
      className: "thumb",
      alt: item.title || ""
    });
    img.src = item.thumb || "data:image/gif;base64,R0lGODlhAQABAAAAACw=";

    const meta = el("div", { className: "meta" });
    const actions = el("div", { className: "actions" });
    
    // プレビューボタン
    const btnView = el("button", {
      className: "view",
      textContent: "プレビュー"
    });
    btnView.onclick = async (ev) => {
      ev.stopPropagation(); // カードクリックの選択トグルとは独立
      try {
        // NAS の場合
        if (item.storage === "nas" && item.nasUrl) {
          openViewer(
            item.title || "",
            item.nasUrl,
            isVideo(item.nasUrl || item.key)
          );
          return;
        }

        // B2 の presign-get
        const pres = await fetch(
          joinPath(CONFIG.WORKER_ORIGIN, "/files/presign-get"),
          {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              key: item.key,
              expires: CONFIG.PRESIGN_EXPIRES
            })
          }
        );
        const { url } = await pres.json();
        if (!url) throw new Error("empty url");
        openViewer(item.title || "", url, isVideo(item.key));
      } catch (e) {
        console.error(e);
        alert("プレビューURLの発行に失敗しました");
      }
    };
    actions.appendChild(btnView);

    // タグ編集ボタン（後で管理者限定にする想定）
    const btnTag = el("button", {
      className: "btn",
      textContent: "タグ編集"
    });
    btnTag.onclick = (ev) => {
      ev.stopPropagation();
      openTagEditor(item);
    };
    actions.appendChild(btnTag);

    meta.appendChild(actions);

    card.appendChild(chkWrap);
    card.appendChild(img);
    card.appendChild(meta);

    // すでに選択状態なら見た目を同期
    if (selectedKeys.has(item.key)) {
      card.classList.add("selected");
      chk.checked = true;
    }

    // カードクリックで選択トグル（選択モード中のみ）
    card.addEventListener("click", (e) => {
      if (!selectionMode) return;

      // ボタンやチェック自体を押したときは無視
      if (e.target.closest("button") || e.target.tagName === "INPUT") return;

      const nowSelected = selectedKeys.has(item.key);
      setSelected(!nowSelected);
    });

    grid.appendChild(card);
  }
}

/* ===== フォルダ内アイテム読み込み → グリッド描画 ===== */
async function renderFolder(manifestUrl){
  console.log("[manifest] url=", manifestUrl);
  const res = await fetch(manifestUrl);
  console.log("[manifest] status=", res.status);
  if (!res.ok) throw new Error("manifest fetch failed");
  const data = await res.json();

  // ★ ここでイベント名などを保持
  currentFolderMeta = {
    date: data.date || null,
    title: data.title || "",
    place: data.place || null,
    note: data.note || null,
  };
  updateFolderHeader();

  const items = data.items || [];
  currentItems = items;

  // ★ いまは使わなくても、とりあえず data.folderNasLink を拾っておく
  const folderNasLink = data.folderNasLink || null;
  currentFolderNasLink = folderNasLink;

  renderGrid(items, folderNasLink);
}
  
/* ===== 原本DL(複数) → ZIP一括DL ===== */
function updateBulkButton() {
  const n = selectedKeys.size;
  const btn = document.getElementById("bulkDownload");
  if (!btn) return;
  btn.textContent = `ダウンロード (${n})`;
  // 選択モードで、かつ1件以上選ばれているときだけ有効
  btn.disabled = !selectionMode || n === 0;
}

document.getElementById("bulkDownload")?.addEventListener("click", async () => {
  if (selectedKeys.size === 0) return;

  const keys = Array.from(selectedKeys);

  // 件数チェック（サーバー側でもチェックしている想定だけど念のため）
  if (keys.length > 100) {
    alert("一度にダウンロードできるのは最大100件までです。枚数を減らしてください。");
    return;
  }

  showZipDialog();

  try {
    const res = await fetch(
      joinPath(CONFIG.WORKER_ORIGIN, "/files/zip"),
      {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ keys }),
      }
    );

    if (!res.ok) {
      console.error("zip failed:", res.status);
      finishZipDialog(false);
      return;
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);

    // フォルダの日付を ZIP 名に使う（なければ "download"）
    const baseName =
      (currentFolderMeta && currentFolderMeta.date) ||
      "download";

    const a = document.createElement("a");
    a.href = url;
    a.download = `${baseName}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // URL開放
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    finishZipDialog(true);
  } catch (e) {
    console.error(e);
    finishZipDialog(false);
  }
});
/* ===== 選択モードのON/OFFとボタン状態更新 ===== */
function setSelectionMode(on) {
  selectionMode = !!on;
  // bodyにクラスを付けてCSS制御
  document.body.classList.toggle("select-mode", selectionMode);

  // モードOFFにしたときは選択をクリア
  if (!selectionMode) {
    selectedKeys.clear();
  }

  // ボタン状態を更新
  updateBulkButton();
  updateSelectButtonsState();

  // カードの見た目を再描画
  renderGrid(currentItems, currentFolderNasLink);
}

function updateSelectButtonsState() {
  const n         = selectedKeys.size;
  const btnToggle = document.getElementById("toggleSelectMode");
  const btnAll    = document.getElementById("selectAll");
  const btnClear  = document.getElementById("clearSelection");
  const hint      = document.getElementById("selectHint");
  const actions   = document.getElementById("selectActions");

  // 選択モードボタンの表示
  if (btnToggle) {
    btnToggle.textContent = selectionMode ? "選択モード ON" : "選択モード OFF";
    btnToggle.classList.toggle("btn-on", selectionMode);
  }

  // 3段目：ヒント or 全選択/全解除 の切り替え
  if (hint && actions) {
    if (selectionMode) {
      hint.style.display    = "none";
      actions.style.display = "flex";
    } else {
      hint.style.display    = "";
      actions.style.display = "none";
    }
  }

  // 全選択 / 全解除の活性・非活性
  if (btnAll) {
    const allSelected = currentItems.length > 0 && n === currentItems.length;
    btnAll.disabled = !selectionMode || currentItems.length === 0 || allSelected;
  }
  if (btnClear) {
    btnClear.disabled = !selectionMode || n === 0;
  }
}
/* ===== プレビュー用モーダル ===== */
function openViewer(title, url, video=false){
  try{
    const dlg = document.getElementById("viewer");
    document.getElementById("v-title").textContent = title;
    const box = document.getElementById("v-container");
    box.innerHTML = "";
    if (video){
      const v = el("video", { controls:true });
      v.src = url;
      box.appendChild(v);
    } else {
      const img = el("img", { className:"modal-img", alt:title });
      img.src = url;
      box.appendChild(img);
    }
    dlg.showModal();
  }catch(e){
    console.error(e);
    window.open(url, "_blank");
  }
}
document.getElementById("v-close")?.addEventListener(
  "click",
  () => document.getElementById("viewer")?.close()
);
/* ===== ZIP作成ダイアログ制御 ===== */
let zipProgressTimer = null;

function showZipDialog() {
  const dlg   = document.getElementById("zipDialog");
  const title = document.getElementById("zipTitle");
  const msg   = document.getElementById("zipStatus");
  const bar   = document.getElementById("zipBarFill");
  const txt   = document.getElementById("zipProgressText");

  if (!dlg) return;

  if (title) title.textContent = "ZIP作成中…";
  if (msg)   msg.textContent   = "サーバーでZIPファイルを作成しています…";
  if (bar)   bar.style.width   = "0%";
  if (txt)   txt.textContent   = "0%";

  dlg.showModal();

  // 疑似プログレス（〜90% までゆっくり上がる）
  let p = 5;
  if (zipProgressTimer) clearInterval(zipProgressTimer);
  zipProgressTimer = setInterval(() => {
    p = Math.min(p + Math.random() * 5, 90);
    if (bar) bar.style.width = p + "%";
    if (txt) txt.textContent = Math.round(p) + "%";
  }, 300);
}

function finishZipDialog(success) {
  const dlg   = document.getElementById("zipDialog");
  const title = document.getElementById("zipTitle");
  const msg   = document.getElementById("zipStatus");
  const bar   = document.getElementById("zipBarFill");
  const txt   = document.getElementById("zipProgressText");

  if (zipProgressTimer) {
    clearInterval(zipProgressTimer);
    zipProgressTimer = null;
  }

  if (bar) bar.style.width = "100%";
  if (txt) txt.textContent = "100%";

  if (title) {
    title.textContent = success
      ? "ダウンロードを開始しました"
      : "ZIPの作成に失敗しました";
  }
  if (msg) {
    msg.textContent = success
      ? "ブラウザのダウンロード一覧からZIPファイルをご確認ください。"
      : "ZIPの作成に失敗しました。選択枚数を減らして再度お試しください。";
  }

  // 1.8秒くらい表示してから自動で閉じる
  setTimeout(() => {
    try { dlg && dlg.close(); } catch (_) {}
  }, 1800);
}
/* ===== タグ編集（prompt版） ===== */
async function openTagEditor(item){
  const currentText = Array.isArray(item.tags) ? item.tags.join(" ") : "";

  const input = prompt(
    "タグをスペース区切りで入力してください（例: 発表 子どもの部 かるがもマラソン）",
    currentText
  );
  if (input === null) return;

  const tags = input
    .split(/\s+/)
    .map(t => t.trim())
    .filter(t => t.length > 0);

  const hadBefore = Array.isArray(item.tags) && item.tags.length > 0;
  if (hadBefore && tags.length === 0) {
    const really = confirm("このメディアについているタグを全て削除します。よろしいですか？");
    if (!really) return;
  }

  try{
    const res = await fetch(
      joinPath(CONFIG.WORKER_ORIGIN, "/items/tag"),
      {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          key: item.key,
          tags
        })
      }
    );
    const js = await res.json();

    if (!res.ok || !js.ok){
      console.error(js);
      alert("タグの更新に失敗しました");
      return;
    }

    item.tags = js.tags;
    await renderFolder(currentManifestUrl);
  }catch(e){
    console.error(e);
    alert("タグ更新中にエラーが発生しました");
  }
}

/* ===== タグ検索（モーダルで選んだタグの AND 条件） ===== */
async function searchByTags(tags){
  // タグ未選択なら「元のフォルダの一覧」に戻す
  if (!tags || !tags.length) {
    if (currentManifestUrl) {
      await renderFolder(currentManifestUrl);
    }
    return;
  }

  const params = new URLSearchParams();
  for (const t of tags) {
    params.append("tag", t);
  }

  // 今のフォルダに紐づく date をパラメータに付ける（フォルダ単位検索）
  if (currentManifestUrl){
    try{
      const u = new URL(currentManifestUrl);
      const d = u.searchParams.get("date");
      if (d) params.set("date", d);
    }catch(e){
      console.warn("date 抽出に失敗しましたが、タグ検索自体は続行します:", e);
    }
  }

  const url = `${CONFIG.WORKER_ORIGIN}/search/items?` + params.toString();

  try{
    const res = await fetch(url);
    if (!res.ok) {
      console.error("search/items status=", res.status);
      alert("タグ検索に失敗しました");
      return;
    }
    const js = await res.json();
    if (!js.ok) {
      console.error(js);
      alert("タグ検索に失敗しました");
      return;
    }

    renderGrid(js.items || [], null);
  }catch(e){
    console.error(e);
    alert("タグ検索中にエラーが発生しました");
  }
}

  /* ===== タグモーダルを開いて一覧を表示 ===== */
async function openTagFilterDialog(){
  const dlg  = document.getElementById("tagDialog");
  const list = document.getElementById("tagList");
  if (!dlg || !list) return;

  // 初回だけタグ一覧を取得
  if (!allTags.length) {
    try{
      const res = await fetch(joinPath(CONFIG.WORKER_ORIGIN, "/tags"));
      const js  = await res.json();
      if (res.ok && js.ok && Array.isArray(js.tags)) {
        allTags = js.tags;
      } else {
        console.warn("タグ一覧の取得に失敗:", js);
      }
    }catch(e){
      console.error("タグ一覧取得エラー:", e);
    }
  }

  // 一覧を描画
  list.innerHTML = "";
  if (!allTags.length) {
    const p = document.createElement("p");
    p.textContent = "利用できるタグがまだありません。";
    p.style.fontSize = "13px";
    p.style.color = "#888";
    list.appendChild(p);
  } else {
    for (const tag of allTags) {
      const isActive = selectedTagFilters.includes(tag);
      const chip = el("button", {
        type:"button",
        textContent: tag,
        className: "tag-chip" + (isActive ? " active" : "")
      });
      chip.addEventListener("click", () => {
        const idx = selectedTagFilters.indexOf(tag);
        if (idx >= 0) {
          selectedTagFilters.splice(idx, 1);
          chip.classList.remove("active");
        } else {
          selectedTagFilters.push(tag);
          chip.classList.add("active");
        }
      });
      list.appendChild(chip);
    }
  }

  try{
    dlg.showModal();
  }catch(e){
    console.error(e);
  }
}
  
// YYYYMMDD → "YYYY年MM月DD日" くらいに整形
function formatDateJp(dateStr){
  if (!/^\d{8}$/.test(dateStr || "")) return dateStr || "";
  const y = dateStr.slice(0, 4);
  const m = dateStr.slice(4, 6);
  const d = dateStr.slice(6, 8);
  return `${y}年${m}月${d}日`;
}

// 上部サブタイトルの描画
function updateFolderHeader(){
  const elHeader = document.getElementById("folderHeader");
  if (!elHeader) return;

  if (!currentFolderMeta.date){
    elHeader.textContent = "";
    return;
  }

  const parts = [];
  parts.push(formatDateJp(currentFolderMeta.date));
  if (currentFolderMeta.title) {
    parts.push(currentFolderMeta.title);
  }

  elHeader.textContent = parts.join(" ｜ ");
}
/* ===== 起動 ===== */
document.addEventListener("DOMContentLoaded", () => {
  // ▼ フォルダ選択画面へ：view 切り替え
  document.getElementById("toFolderList")?.addEventListener("click", () => {
    switchView("view-folder-list");
  });

  const input = $("#tagSearchInput");
  const btnSearch = $("#tagSearchButton");
  const btnClear  = $("#tagSearchClear");

  btnSearch?.addEventListener("click", () => {
    runTagSearch();
  });

  input?.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      runTagSearch();
    }
  });

  btnClear?.addEventListener("click", async () => {
    if (input) input.value = "";
    if (currentManifestUrl) {
      await renderFolder(currentManifestUrl);
    }
  });
  // ★ 選択モードボタン類
  const btnToggleSelect = document.getElementById("toggleSelectMode");
  const btnSelectAll    = document.getElementById("selectAll");
  const btnClearSel     = document.getElementById("clearSelection");

  btnToggleSelect?.addEventListener("click", () => {
    setSelectionMode(!selectionMode);
  });

  btnSelectAll?.addEventListener("click", () => {
    if (!selectionMode) return;
    for (const item of currentItems) {
      selectedKeys.add(item.key);
    }
    renderGrid(currentItems, currentFolderNasLink);
  });

  btnClearSel?.addEventListener("click", () => {
    if (!selectionMode) return;
    selectedKeys.clear();
    renderGrid(currentItems, currentFolderNasLink);
  });
  
  // タグ絞り込みボタン → モーダルを開く
  const btnTagFilter = document.getElementById("tagFilterOpen");
  btnTagFilter?.addEventListener("click", () => {
    openTagFilterDialog();
  });

  // タグモーダルのボタンたち
  document.getElementById("tagDialogClose")?.addEventListener("click", () => {
    document.getElementById("tagDialog")?.close();
  });

  document.getElementById("tagClear")?.addEventListener("click", async () => {
    selectedTagFilters = [];
    await searchByTags([]);  // 絞り込み解除
    // チップの見た目もリセット
    document.querySelectorAll("#tagList .tag-chip").forEach(chip => {
      chip.classList.remove("active");
    });
  });

  document.getElementById("tagApply")?.addEventListener("click", async () => {
    await searchByTags(selectedTagFilters);
    document.getElementById("tagDialog")?.close();
  });
  // 初期状態のボタン表示
  updateSelectButtonsState();
  loadFolderIndex();
});
