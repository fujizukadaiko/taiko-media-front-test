<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>カタログ｜Taiko Media</title>
<style>
:root{
  /* —— 共通パレット（アップロードに合わせた淡い緑系） —— */
  --brand:#c1d8ac;         /* 主色：裏葉柳 */
  --brand-d:#a9c890;       /* 濃いめ（枠/hover） */
  --bgpage:#ebf6f7;        /* ページ地：藍白 */
  --panel:#ffffff;         /* カード背景 */
  --text:#1e2a1e;          /* 文字 */
  --muted:#6f7f6a;         /* 補助文字 */
  --border:#e6eedc;        /* 薄い枠線（カード/区切り） */
  --chip:#f7fbf3;          /* ゴースト系の下地 */
}

/* ベース */
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bgpage)}
body{
  margin:0;
  background:var(--bgpage);
  color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial;
}
.container{max-width:1100px;margin:24px auto;padding:0 16px}

/* ヘッダ */
  .topbar{
    display:flex; gap:12px; align-items:center; justify-content:space-between;
    background:#fff; border:1px solid var(--border);
    padding:14px 16px; border-radius:16px; margin:12px 0 20px;
  }
/* タイトル（少し小さめ） */
  .brand h1{
    font-size:clamp(18px, 3.8vw, 22px);
    line-height:1.25; margin:0;
  }
/* バッジ（READY等） */
.badge-ok{
  background:var(--chip); color:#456b4a;
  border:1px solid var(--border);
  padding:5px 10px; border-radius:999px; font-size:12px
}

/* 入力/ボタン（共通トーン） */
input[type="text"]{
  background:#fff; color:var(--text);
  border:1px solid var(--border); padding:10px 12px; border-radius:12px; min-width:260px
}
button,.btn{
  background:var(--brand); color:#102010; border:1px solid var(--brand-d);
  padding:10px 14px; border-radius:12px; cursor:pointer;
}
button:hover,.btn:hover{filter:brightness(1.02)}
button:active,.btn:active{transform:translateY(1px)}
button.ghost,.btn.ghost{
  background:var(--chip); color:var(--text);
  border:1px solid var(--border);
}

/* カードグリッド */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px;
}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f2f6ee}
.meta{padding:12px 14px}
.title{font-size:14px;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2c3d2c}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{
  font-size:11px;color:var(--muted);
  background:var(--chip);
  border:1px solid var(--border);
  padding:4px 8px;border-radius:999px
}
.actions{display:flex;gap:8px;margin-top:10px}
.actions a,.actions button{
  flex:1; text-align:center; font-size:13px; padding:10px 12px; border-radius:12px
}
/* プライマリ：原本DL（緑） / セカンダリ：プレビュー（ゴースト） */
.dl{background:var(--brand); color:#102010; border:1px solid var(--brand-d)}
.view{background:var(--chip); color:var(--text); border:1px solid var(--border)}

/* フォルダ全体のNAS共有バー（目立ちすぎない緑枠） */
.card[style*="dashed"]{ border-color:var(--border)!important; background:#fff }

/* フッター */
footer{color:#94a38f;font-size:11px;margin:28px 0;text-align:center}

/* モーダル（プレビュー） */
dialog{
  max-width:92vw; width:900px;
  background:#fff; border:1px solid var(--border); border-radius:16px; color:var(--text);
}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border); padding:10px 14px
}
.modal-body{padding:14px}
video,.modal-img{
  width:100%; max-height:70vh; object-fit:contain; background:#f2f6ee; border-radius:12px
}

/* レスポンシブ微調整 */
@media (max-width:640px){
  .right{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="container">
  </head>
<body>
<div class="container">
 <header class="topbar">
  <div class="brand">
    <h1>カタログ</h1>
  </div>
  <div class="right">
    <a id="toCatalog" class="btn ghost small" href="#" role="button">アップロードへ</a>
  </div>
</header>

  <div id="grid" class="grid"></div>
  <footer>© Taiko Media</footer>
</div>

<dialog id="viewer">
  <div class="modal-head">
    <strong id="v-title"></strong>
    <button id="v-close" class="ghost">閉じる</button>
  </div>
  <div class="modal-body">
    <div id="v-container"></div>
  </div>
</dialog>

<script>
/* ===== 必要な設定（ここだけ編集） ===== */
const WORKER_ORIGIN  = "https://taiko-worker-plain.fujizukadaiko.workers.dev"; // ← 実URLに
const MANIFEST_URL   = "https://fujizukadaiko.github.io/taiko-media-front-test/manifest/20251012-concertA.json";

/* ===== ユーティリティ ===== */
function sanitizeUrl(s){
  if (!s) return "";
  return String(s)
    .replace(/[\u200B-\u200D\uFEFF]/g,"")   // ゼロ幅/BOM
    .replace(/\s+/g,"")                     // 改行・空白
    .replace(/[：]/g,":").replace(/[／]/g,"/") // 全角→半角
    .replace(/^"+|"+$/g,"")                 // 先頭/末尾の引用符
    .trim();
}
const N_WORKER   = sanitizeUrl(WORKER_ORIGIN).replace(/\/+$/,"");
const N_MANIFEST = sanitizeUrl(MANIFEST_URL);

function assertUrl(u, name){ try{ new URL(u) }catch(e){ alert(`${name} が不正です：\n${u}`); throw e; } }
assertUrl(N_WORKER,  "WORKER_ORIGIN");
assertUrl(N_MANIFEST,"MANIFEST_URL");

const joinPath = (base, path) => base.replace(/\/+$/,"") + path;
const qs = (s, p=document) => p.querySelector(s);
const el = (t, c) => Object.assign(document.createElement(t), c);
const isVideo = (name='') => /\.(mp4|mov|webm)$/i.test(name);

async function loadManifest(){
  const res = await fetch(N_MANIFEST);
  if (!res.ok) throw new Error("manifest fetch failed: " + res.status);
  return await res.json();
}

function openViewer(title, url, video=false){
  try{
    const dlg = qs("#viewer");
    qs("#v-title").textContent = title;
    const box = qs("#v-container"); box.innerHTML = "";
    if (video){
      const v = el("video", { controls:true }); v.src = url; box.appendChild(v);
    }else{
      const img = el("img", { className:"modal-img", alt:title }); img.src = url; box.appendChild(img);
    }
    dlg.showModal();
  }catch(e){
    console.error(e); window.open(url, "_blank");
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  // ヘッダーのボタン
  document.getElementById("open-manifest")?.addEventListener("click", () => {
    window.open(N_MANIFEST, "_blank");
  });
  const badge = document.getElementById("badge-status");

  // マニフェスト読込 → グリッド描画
  try {
    const data = await loadManifest();
    if (badge) badge.textContent = "LOADED";

    const grid = qs("#grid"); grid.innerHTML = "";
    for (const item of (data.items || [])) {
      const card = el("div", { className:"card" });

      const img = el("img", { className:"thumb", alt:item.title || "" });
      img.src = item.thumb || "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
      card.appendChild(img);

      const meta = el("div", { className:"meta" });
      meta.appendChild(el("div", { className:"title", textContent: item.title || (item.key?.split("/").pop() || "") }));

      const badges = el("div", { className:"badges" });
      badges.appendChild(el("span", { className:"badge", textContent: isVideo(item.key) ? "video" : "image" }));
      if (item.nasLink) badges.appendChild(el("span", { className:"badge", textContent: "NAS" }));
      meta.appendChild(badges);

      const actions = el("div", { className:"actions" });

      // プレビュー（B2 presign GET）
      const btnView = el("button", { className:"view", textContent:"プレビュー" });
      btnView.onclick = async () => {
        try{
          const pres = await fetch(joinPath(N_WORKER, "/files/presign-get"), {
            method:"POST",
            headers:{ "content-type":"application/json" },
            body: JSON.stringify({ key: item.key, expires: 300 })
          });
          const { url } = await pres.json();
          if (!url) throw new Error("presign-get returned empty url");
          openViewer(item.title || "", url, isVideo(item.key));
        }catch(e){ console.error(e); alert("プレビュー用URLの発行に失敗しました"); }
      };
      actions.appendChild(btnView);

      // 原本DL（NAS優先／なければB2 presign GET with attachment）
      const aDL = el("a", { className:"dl", target:"_blank", textContent:"原本DL" });
      if (item.nasLink && /^https?:\/\//.test(item.nasLink)) {
        aDL.href = item.nasLink;
      } else {
        aDL.onclick = async (ev) => {
          ev.preventDefault();
          try{
            const pres = await fetch(joinPath(N_WORKER, "/files/presign-get"), {
              method:"POST",
              headers:{ "content-type":"application/json" },
              body: JSON.stringify({ key: item.key, expires: 300, attachment: true })
            });
            const { url } = await pres.json();
            if (!url) throw new Error("presign-get returned empty url");
            window.open(url, "_blank");
          }catch(e){ console.error(e); alert("ダウンロード用URLの発行に失敗しました"); }
        };
      }
      actions.appendChild(aDL);

      meta.appendChild(actions);
      card.appendChild(meta);
      grid.appendChild(card);
    }

    // フォルダ全体のNAS共有
    if (data.folderNasLink && /^https?:\/\//.test(data.folderNasLink)) {
      const bar = el("div", { className:"card", style:"padding:12px;border:1px dashed #2a2e38" });
      const link = el("a", { className:"dl", href:data.folderNasLink, target:"_blank", textContent:"フォルダごとダウンロード（NAS共有）" });
      bar.appendChild(link);
      grid.prepend(bar);
    }
  } catch (e) {
    console.error(e);
    if (badge) badge.textContent = "ERROR";
    alert("マニフェストの読み込みに失敗しました。\nURLや公開状態を確認してください。");
  }

  // モーダルの閉じる
  document.getElementById("v-close")?.addEventListener("click", () => {
    document.getElementById("viewer")?.close();
  });
});
</script>
</body>
</html>
