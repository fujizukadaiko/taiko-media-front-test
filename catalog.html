<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>カタログ｜Taiko Media</title>
<style>
:root {
  --bg:#0b0c10; --panel:#14161a; --text:#e6e7ea; --muted:#9aa3b2;
  --accent:#7c5cff; --accent-2:#2dd4bf; --border:#22252c;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#0a0b11,#0d0f15 60%,#0a0b11);
  color:var(--text);
  font:16px/1.6 system-ui, -apple-system, "Segoe UI", Arial;
}
.container{max-width:1100px;margin:24px auto;padding:0 16px}

/* ===== ヘッダー（Topbar）ここから ===== */
.topbar{
  display:flex; gap:12px; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg,#111318,#0f1116);
  border:1px solid var(--border);
  padding:12px 14px; border-radius:14px; margin:12px 0 20px;
  box-shadow:0 6px 24px rgb(0 0 0 / .25);
}
.brand{display:flex; gap:12px; align-items:center}
.brand h1{font-size:20px; margin:0}
.sub{color:var(--muted); font-size:12px}
.controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

.pill{
  display:flex; align-items:center; gap:8px;
  background:#101319; border:1px solid var(--border);
  padding:8px 10px; border-radius:999px; font-size:12px;
}
.pill code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px; color:#cfd4e1;
}
.icon{opacity:.8}
.btn{
  background:var(--accent); color:#fff; border:none;
  padding:8px 12px; border-radius:10px; cursor:pointer
}
.btn.ghost{background:#1a1c22}
.btn:hover{opacity:.92}
.btn:active{transform:translateY(1px)}
.badge-ok{
  background:#132118; color:#8BECA5; border:1px solid #1f3a29;
  padding:3px 6px; border-radius:999px; font-size:11px
}
/* ===== ヘッダー（Topbar）ここまで ===== */

/* 既存のUI（変更なし） */
h1{font-size:22px;margin:0}
input[type="text"]{background:#0f1116;color:var(--text);border:1px solid var(--border);padding:10px 12px;border-radius:10px;min-width:260px}
button{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer}
button.ghost{background:#1a1c22}
button:hover{opacity:.92}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgb(0 0 0 / .3)}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#0f1116}
.meta{padding:10px 12px}
.title{font-size:14px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;color:var(--muted);background:#101319;border:1px solid var(--border);padding:3px 6px;border-radius:999px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions a,.actions button{flex:1; text-align:center; font-size:13px; padding:9px 10px; border-radius:10px}
.dl{background:var(--accent-2); color:#0c1210;}
.view{background:#1a1c22; color:#dbe0ea; border:1px solid var(--border)}
.muted{opacity:.6; pointer-events:none}
footer{color:var(--muted);font-size:12px;margin:24px 0;text-align:center}

/* モーダル */
dialog{max-width:92vw;width:900px;background:var(--panel);border:1px solid var(--border);border-radius:16px;color:var(--text)}
.modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:10px 14px}
.modal-body{padding:14px}
video, .modal-img{width:100%;max-height:70vh;object-fit:contain;background:#0f1116;border-radius:12px}

/* レスポンシブ微調整 */
@media (max-width:640px){
  .pill{max-width:100%; overflow:hidden}
  .pill code{display:inline-block; max-width:46vw; text-overflow:ellipsis; overflow:hidden; white-space:nowrap}
}
  .right{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div class="brand">
      <h1>カタログ</h1>
      <div class="sub">イベントのプレビュー & 原本ダウンロード</div>
    </div>
    <div class="right">
      <span class="badge-ok" id="badge-status">READY</span>
      <button class="btn ghost" id="open-manifest">マニフェスト</button>
    </div>
  </header>

  <div id="grid" class="grid"></div>
  <footer>© Taiko Media</footer>
</div>

<dialog id="viewer">
  <div class="modal-head">
    <strong id="v-title"></strong>
    <button id="v-close" class="ghost">閉じる</button>
  </div>
  <div class="modal-body">
    <div id="v-container"></div>
  </div>
</dialog>

<script>
/* ===== 必要な設定（ここだけ編集） ===== */
const WORKER_ORIGIN  = "https://taiko-worker-plain.fujizukadaiko.workers.dev"; // ← ここを実URLに
const MANIFEST_URL   = "https://fujizukadaiko.github.io/taiko-media-front-test/manifest/20251012-concertA.json";

/* ===== ユーティリティ ===== */
function sanitizeUrl(s){
  if (!s) return "";
  return String(s)
    .replace(/[\u200B-\u200D\uFEFF]/g,"")   // ゼロ幅/BOM
    .replace(/\s+/g,"")                     // 改行・空白
    .replace(/[：]/g,":").replace(/[／]/g,"/") // 全角→半角
    .replace(/^"+|"+$/g,"")                 // 先頭/末尾の引用符
    .trim();
}
const N_WORKER = sanitizeUrl(WORKER_ORIGIN).replace(/\/+$/,"");
const N_MANIFEST = sanitizeUrl(MANIFEST_URL);

function assertUrl(u, name){
  try { new URL(u) } catch(e){
    alert(`${name} が不正です：\n${u}\n（全角/改行/引用符などを削除してください）`);
    throw e;
  }
}
assertUrl(N_WORKER,  "WORKER_ORIGIN");
assertUrl(N_MANIFEST, "MANIFEST_URL");

const normalizeUrl = (s) => s; // 既に sanitize 済み
const joinPath = (base, path) => base.replace(/\/+$/,"") + path;

const qs = (s, p=document) => p.querySelector(s);
const el = (t, c) => Object.assign(document.createElement(t), c);
const isVideo = (name='') => /\.(mp4|mov|webm)$/i.test(name);

async function loadManifest() {
  console.log("MANIFEST_URL =", N_MANIFEST);
  const res = await fetch(N_MANIFEST);
  if (!res.ok) throw new Error("manifest fetch failed: " + res.status);
  return await res.json();
}

function openViewer(title, url, video=false){
  try {
    const dlg = qs("#viewer");
    qs("#v-title").textContent = title;
    const box = qs("#v-container"); box.innerHTML = "";
    if (video) {
      const v = el("video", { controls:true }); v.src = url; box.appendChild(v);
    } else {
      const img = el("img", { className:"modal-img", alt:title }); img.src = url; box.appendChild(img);
    }
    dlg.showModal();
  } catch(e) {
    console.error(e);
    window.open(url, "_blank");
  }
}

/* ===== 初期化（ヘッダーだけ上書きせずに値を流し込む） ===== */
document.addEventListener("DOMContentLoaded", async () => {
  // ヘッダーのピルに表示
  const $w = document.getElementById("pill-worker");
  const $m = document.getElementById("pill-manifest");
  const $badge = document.getElementById("badge-status");
  document.getElementById("open-manifest")?.addEventListener("click", () => {
    window.open(N_MANIFEST, "_blank");
  });

  // ヘッダーのボタン動作
  document.getElementById("copy-worker")?.addEventListener("click", async () => {
    await navigator.clipboard.writeText(N_WORKER);
  });
  document.getElementById("copy-manifest")?.addEventListener("click", async () => {
    await navigator.clipboard.writeText(N_MANIFEST);
  });
  document.getElementById("open-manifest")?.addEventListener("click", () => {
    window.open(N_MANIFEST, "_blank");
  });

  // マニフェスト読込
  try {
  const data = await loadManifest();
  if ($badge) $badge.textContent = "LOADED";

    const grid = qs("#grid"); grid.innerHTML = "";
    for (const item of (data.items || [])) {
      const card = el("div", { className:"card" });
      const img = el("img", { className:"thumb", alt:item.title || "" });
      img.src = item.thumb || "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
      card.appendChild(img);

      const meta = el("div", { className:"meta" });
      meta.appendChild(el("div", { className:"title", textContent:item.title || item.key?.split("/").pop() || "" }));

      const badges = el("div", { className:"badges" });
      badges.appendChild(el("span", { className:"badge", textContent: isVideo(item.key) ? "video" : "image" }));
      if (item.nasLink) badges.appendChild(el("span", { className:"badge", textContent: "NAS" }));
      meta.appendChild(badges);

      const actions = el("div", { className:"actions" });

      // プレビュー（B2の一時URL）
      const btnView = el("button", { className:"view", textContent:"プレビュー" });
      btnView.onclick = async () => {
        try {
          const urlPresign = joinPath(N_WORKER, "/files/presign-get");
          const pres = await fetch(urlPresign, {
            method:"POST",
            headers: { "content-type":"application/json" },
            body: JSON.stringify({ key: item.key, expires: 300 })
          });
          const { url } = await pres.json();
          if (!url) throw new Error("presign-get returned empty url");
          openViewer(item.title || "", url, isVideo(item.key));
        } catch (e) {
          console.error(e);
          alert("プレビュー用URLの発行に失敗しました");
        }
      };
      actions.appendChild(btnView);

      // 原本DL（NAS>優先 / フォールバックはB2一時URL）
      const aDL = el("a", { className:"dl", target:"_blank", textContent:"原本DL" });
      if (item.nasLink && /^https?:\/\//.test(item.nasLink)) {
        aDL.href = item.nasLink;
      } else {
        aDL.onclick = async (e) => {
          e.preventDefault();
          try {
            const urlPresign = joinPath(N_WORKER, "/files/presign-get");
            const pres = await fetch(urlPresign, {
              method:"POST",
              headers: { "content-type":"application/json" },
              body: JSON.stringify({ key: item.key, expires: 300, attachment: true })
            });
            const { url } = await pres.json();
            if (!url) throw new Error("presign-get returned empty url");
            window.open(url, "_blank");
          } catch (e) {
            console.error(e);
            if ($badge) $badge.textContent = "ERROR";
            alert("マニフェストの読み込みに失敗しました。\nURLや公開状態を確認してください。");
          }
          }
        };
      }
      actions.appendChild(aDL);

      meta.appendChild(actions);
      card.appendChild(meta);
      grid.appendChild(card);
    }

    // フォルダ全体のNAS共有があれば目立つ場所に
    if (data.folderNasLink && /^https?:\/\//.test(data.folderNasLink)) {
      const bar = el("div", { className:"card", style:"padding:12px;border:1px dashed #2a2e38" });
      const link = el("a", { className:"dl", href:data.folderNasLink, target:"_blank", textContent:"フォルダごとダウンロード（NAS共有）" });
      bar.appendChild(link);
      grid.prepend(bar);
    }
  } catch (e) {
    console.error(e);
    if ($badge) { $badge.textContent = "ERROR"; }
    alert("マニフェストの読み込みに失敗しました。\nURLや公開状態を確認してください。");
  }
});
</script>
</body>
</html>
