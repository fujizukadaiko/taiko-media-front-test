<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>カタログ｜藤塚太鼓</title>
<style>
:root{
  /* —— 共通パレット（アップロードに合わせた淡い緑系） —— */
  --brand:#c1d8ac;         /* 主色：裏葉柳 */
  --brand-d:#a9c890;       /* 濃いめ（枠/hover） */
  --bgpage:#ebf6f7;        /* ページ地：藍白 */
  --panel:#ffffff;         /* カード背景 */
  --text:#1e2a1e;          /* 文字 */
  --muted:#6f7f6a;         /* 補助文字 */
  --border:#e6eedc;        /* 薄い枠線（カード/区切り） */
  --chip:#f7fbf3;          /* ゴースト系の下地 */
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bgpage);
  color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial;
}
.container{max-width:1100px;margin:24px auto;padding:0 16px}

/* ── ヘッダ ── */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--panel); border:1px solid var(--border);
  padding:14px 16px; border-radius:16px; margin:12px 0 16px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}
.brand h1{font-size:clamp(18px,3.8vw,22px);margin:0;}
.topbar .right{display:flex;align-items:center;gap:8px;}
a.btn,button.btn{
  background:var(--brand); color:#102010;
  border:1px solid var(--brand-d);
  padding:8px 14px; border-radius:10px;
  text-decoration:none; cursor:pointer; font-size:14px;
}
a.btn.ghost,button.btn.ghost{
  background:var(--chip); color:var(--text);
  border:1px solid var(--border);
}
a.btn:hover,button.btn:hover{filter:brightness(1.03);}
a.btn:active,button.btn:active{transform:translateY(1px);}
a.btn:disabled,button.btn:disabled{opacity:.6;cursor:not-allowed;}

/* ── フィルタ行（日付セレクタ＋DLボタン） ── */
.controls{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin:0 0 18px;
}
.controls select{
  flex:1;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff; color:var(--text);
  font-size:15px;
}
.controls button.btn{
  white-space:nowrap;
}
.controls input{
  flex:2;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  font-size:14px;
}
/* ── グリッド ── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px;
}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f2f6ee;}
.meta{padding:12px 14px;}
.title{font-size:14px;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2c3d2c;}
.badges{display:flex;gap:6px;flex-wrap:wrap;}
.badge{
  font-size:11px;color:var(--muted);
  background:var(--chip);
  border:1px solid var(--border);
  padding:4px 8px;border-radius:999px;
}
.actions{display:flex;gap:8px;margin-top:10px;}
.actions button{flex:1;text-align:center;font-size:13px;padding:10px 12px;border-radius:12px;}
.view{background:var(--chip);color:var(--text);border:1px solid var(--border);}

/* フッター（中央・小さく・薄く） */
  footer{
    color:#94a38f; font-size:11px; margin:28px 0; text-align:center;
  }
  
</style>
</head>

<body>
<div class="container">
  <header class="topbar">
    <div class="brand"><h1>カタログ</h1></div>
    <div class="right">
      <a id="toCatalog" class="btn ghost" href="#">アップロードへ</a>
    </div>
  </header>

  <div class="controls">
    <select id="folderSelect"><option>読み込み中…</option></select>

    <!-- 追加: タグ絞り込み用の入力とボタン -->
    <input
      id="tagSearch"
      type="text"
      placeholder="タグで絞り込み（例: 発表 子どもの部）"
    />
    <button id="tagSearchBtn" class="btn ghost">絞り込み</button>

    <button id="bulkDownload" class="btn" disabled>原本DL (0)</button>
  </div>

  <div id="grid" class="grid"></div>

  <footer id="copyright"></footer>
  <script>
    // 初出年を必要に応じて変更
    const FIRST_YEAR = 1996;
    const y = new Date().getFullYear();
    const range = (y === FIRST_YEAR) ? `${y}` : `${FIRST_YEAR}–${y}`;
    // 実際の権利者名に置き換えてください
    const holder = "藤塚太鼓";
    document.getElementById("copyright").textContent = `© ${range} ${holder}`;
  </script>
</div>
<dialog id="viewer">
  <div class="modal-head">
    <strong id="v-title"></strong>
    <button id="v-close" class="ghost">閉じる</button>
  </div>
  <div class="modal-body">
    <div id="v-container"></div>
  </div>
</dialog>

<script>
/* ===== 設定 ===== */
const CONFIG = {
  WORKER_ORIGIN: "https://taiko-worker-plain.fujizukadaiko.workers.dev",
  INDEX_URL: "https://taiko-worker-plain.fujizukadaiko.workers.dev/catalog/index", // フォルダ索引
  PRESIGN_EXPIRES: 300,
  UPLOAD_URL: "https://fujizukadaiko.github.io/taiko-media-front-test/index.html" // ← 実URLに
};

/* ===== 便利関数 ===== */
const $ = (s,p=document)=>p.querySelector(s);
const el = (t,props={}) => Object.assign(document.createElement(t), props);
const joinPath = (base, path) => base.replace(/\/+$/,"") + path;
const isVideo = (name='') => /\.(mp4|mov|webm|m4v)$/i.test(name);

/* ===== 状態 ===== */
let currentManifestUrl = "";
let currentItems = [];
let currentFolderMeta = { folderNasLink: null, date: null, title: "" };
const selectedKeys = new Set();

/* ===== フォルダ一覧読み込み → セレクタへ反映 ===== */
async function loadFolderIndex(){
  const res = await fetch(CONFIG.INDEX_URL);
  console.log("[index] url=", CONFIG.INDEX_URL, "status=", res.status);
  if (!res.ok) throw new Error("index fetch failed");
  const { folders=[] } = await res.json();

  const sel = document.getElementById("folderSelect");
  if (!sel) return;
  sel.innerHTML = "";

  for (const f of folders){
    const opt = el("option", {
      value: f.manifest,
      textContent: f.title ? `${f.date}｜${f.title}` : f.date
    });
    sel.appendChild(opt);
  }

  if (folders.length){
    sel.value = folders[0].manifest;
    currentManifestUrl = sel.value;
  }
  if (currentManifestUrl) await renderFolder(currentManifestUrl);

  sel.onchange = async ()=>{
    selectedKeys.clear();
    updateBulkButton();
    currentManifestUrl = sel.value;
    await renderFolder(currentManifestUrl);
  };
}

/* ===== フォルダ内アイテム読み込み → 状態更新 + グリッド描画 ===== */
async function renderFolder(manifestUrl){
  console.log("[manifest] url=", manifestUrl);
  const res = await fetch(manifestUrl);
  console.log("[manifest] status=", res.status);
  if (!res.ok) throw new Error("manifest fetch failed");
  const data = await res.json();

  // 状態更新
  currentItems = data.items || [];
  currentFolderMeta = {
    folderNasLink: data.folderNasLink || null,
    date: data.date || null,
    title: data.title || ""
  };

  // 実際の描画
  drawGrid(currentItems);
}

/* ===== グリッド描画（items 配列をもとにカードを並べる） ===== */
function drawGrid(items){
  const grid = $("#grid");
  grid.innerHTML = "";

  // 先頭に「フォルダNAS共有」バー（あれば）
  if (currentFolderMeta.folderNasLink && /^https?:\/\//.test(currentFolderMeta.folderNasLink)){
    const bar = el("div", {
      className: "card",
      style: "padding:12px;border:1px dashed var(--border);background:#fff"
    });
    const a = el("a", {
      href: currentFolderMeta.folderNasLink,
      target: "_blank",
      textContent: "フォルダごとダウンロード（NAS共有）"
    });
    bar.appendChild(a);
    grid.appendChild(bar);
  }

  // ==== 各アイテムのカード描画 ====
  for (const item of items){
    const card = el("div", { className: "card" });

    // チェックボックス行
    const chkWrap = el("div", {
      style: "display:flex;align-items:center;gap:8px;padding:10px 12px"
    });
    const chk = el("input", { type: "checkbox" });
    chk.onchange = () => {
      if (chk.checked) selectedKeys.add(item.key);
      else selectedKeys.delete(item.key);
      updateBulkButton();
    };
    const label = el("div", { style: "flex:1" });

    // タイトル
    const title = el("div", {
      className: "title",
      textContent: item.title || (item.key?.split("/").pop() || "")
    });

    // バッジ（種別 + タグ）
    const badges = el("div", { className: "badges" });

    // ① 種別バッジ（video / image）
    const kind = isVideo(item.key) ? "video" : "image";
    const kindBadge = el("span", {
      className: "badge",
      textContent: kind
    });
    if (kind === "video"){
      kindBadge.style.color = "#2d5560";
      kindBadge.style.background = "#eef8fb";
    } else {
      kindBadge.style.color = "#47644a";
      kindBadge.style.background = "#f2f7f1";
    }
    badges.appendChild(kindBadge);

    // ② タグバッジ
    if (Array.isArray(item.tags)){
      for (const tagName of item.tags){
        const tagBadge = el("span", {
          className: "badge",
          textContent: tagName
        });
        badges.appendChild(tagBadge);
      }
    }

    // label 組み立て
    label.appendChild(title);
    label.appendChild(badges);
    chkWrap.appendChild(chk);
    chkWrap.appendChild(label);

    // サムネイル
    const img = el("img", {
      className: "thumb",
      alt: item.title || ""
    });
    img.src = item.thumb || "data:image/gif;base64,R0lGODlhAQABAAAAACw=";

    // 下部アクション
    const meta = el("div", { className: "meta" });
    const actions = el("div", { className: "actions" });

    const btnView = el("button", {
      className: "view",
      textContent: "プレビュー"
    });
    btnView.onclick = async () => {
      try{
        const pres = await fetch(
          joinPath(CONFIG.WORKER_ORIGIN, "/files/presign-get"),
          {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              key: item.key,
              expires: CONFIG.PRESIGN_EXPIRES
            })
          }
        );
        const { url } = await pres.json();
        if (!url) throw new Error("empty url");
        openViewer(item.title || "", url, isVideo(item.key));
      }catch(e){
        console.error(e);
        alert("プレビューURLの発行に失敗しました");
      }
    };
    actions.appendChild(btnView);

    // タグ編集ボタン
    const btnTag = el("button", {
      className: "btn",
      textContent: "タグ編集"
    });
    btnTag.onclick = () => openTagEditor(item);
    actions.appendChild(btnTag);

    meta.appendChild(actions);
    card.appendChild(chkWrap);
    card.appendChild(img);
    card.appendChild(meta);
    grid.appendChild(card);
  }
}

/* ===== 原本DL(複数) ===== */
function updateBulkButton(){
  const btn = $("#bulkDownload");
  const n = selectedKeys.size;
  btn.textContent = `原本DL (${n})`;
  btn.disabled = n === 0;
}
document.getElementById("bulkDownload")?.addEventListener("click", async ()=>{
  if (selectedKeys.size === 0) return;
  const keys = Array.from(selectedKeys);
  for (const key of keys){
    try{
      const pres = await fetch(joinPath(CONFIG.WORKER_ORIGIN, "/files/presign-get"), {
        method:"POST",
        headers:{ "content-type":"application/json" },
        body: JSON.stringify({ key, expires: CONFIG.PRESIGN_EXPIRES, attachment: true })
      });
      const { url } = await pres.json();
      if (url){
        const w = window.open(url, "_blank");
        if (!w) location.href = url;
      }
      await new Promise(r=>setTimeout(r, 400));
    }catch(e){ console.error(e); }
  }
});

/* ===== プレビュー用モーダル ===== */
function openViewer(title, url, video=false){
  try{
    const dlg = document.getElementById("viewer");
    document.getElementById("v-title").textContent = title;
    const box = document.getElementById("v-container");
    box.innerHTML = "";
    if (video){
      const v = el("video", { controls:true });
      v.src = url;
      box.appendChild(v);
    } else {
      const img = el("img", { className:"modal-img", alt:title });
      img.src = url;
      box.appendChild(img);
    }
    dlg.showModal();
  }catch(e){
    console.error(e);
    window.open(url, "_blank");
  }
}
document.getElementById("v-close")?.addEventListener(
  "click",
  () => document.getElementById("viewer")?.close()
);
  
// ==== タグ絞り込み（フォルダ内のみ） ====
function applyTagFilterFromInput(){
  const input = $("#tagSearch");
  if (!input) return;

  const q = input.value || "";
  const words = q
    .split(/\s+/)
    .map(t => t.trim())
    .filter(Boolean);

  // 何も入力されていなければ元に戻す
  if (words.length === 0){
    drawGrid(currentItems);
    return;
  }

  const filtered = currentItems.filter(item => {
    const tags = Array.isArray(item.tags) ? item.tags : [];
    // 全てのキーワードをどこかのタグが含んでいれば OK（AND 条件）
    return words.every(w =>
      tags.some(tag => tag.includes(w))
    );
  });

  drawGrid(filtered);
}
  
// ===== タグ編集（超シンプル版：prompt で編集） =====
async function openTagEditor(item){
  const currentText = Array.isArray(item.tags) ? item.tags.join(" ") : "";

  const input = prompt(
    "タグをスペース区切りで入力してください（例: 発表 子どもの部 かるがもマラソン）",
    currentText
  );
  if (input === null) return;

  const tags = input
    .split(/\s+/)
    .map(t => t.trim())
    .filter(t => t.length > 0);

  // ★ ここ：元々タグあったのに、今回ゼロになっている＝実質「全部削除」
  const hadBefore = Array.isArray(item.tags) && item.tags.length > 0;
  if (hadBefore && tags.length === 0) {
    const really = confirm("このメディアについているタグを全て削除します。よろしいですか？");
    if (!really) return; // キャンセル → 何もしない
  }

  try {
    const res = await fetch(
      joinPath(CONFIG.WORKER_ORIGIN, "/items/tag"),
      {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          key: item.key,
          tags
        })
      }
    );
    const js = await res.json();

    if (!res.ok || !js.ok){
      console.error(js);
      alert("タグの更新に失敗しました");
      return;
    }

    item.tags = js.tags;
    await renderFolder(currentManifestUrl);
  }catch(e){
    console.error(e);
    alert("タグ更新中にエラーが発生しました");
  }
}
  
/* ===== 起動 ===== */
document.addEventListener("DOMContentLoaded", () => {
  const a = document.getElementById("toCatalog");
  if (a && CONFIG.UPLOAD_URL) {
    a.href = CONFIG.UPLOAD_URL;
    a.target = "_self";
  }

  // タグ検索ボタン
  const btnSearch = document.getElementById("tagSearchBtn");
  if (btnSearch){
    btnSearch.addEventListener("click", () => applyTagFilterFromInput());
  }

  // Enter でも絞り込み
  const input = document.getElementById("tagSearch");
  if (input){
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter"){
        e.preventDefault();
        applyTagFilterFromInput();
      }
    });
  }

  loadFolderIndex();
});
</script>
</body>
</html>
