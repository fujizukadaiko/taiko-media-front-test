<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>カタログ｜藤塚太鼓</title>
<style>
/* =================================================================
   CSS：カラーパレット
   ================================================================= */
    :root{
      --brand:#c1d8ac;
      --brand-d:#a9c890;
      --bgpage:#ebf6f7;
      --panel:#ffffff;
      --text:#1e2a1e;
      --muted:#6f7f6a;
      --border:#e6eedc;
      --chip:#f7fbf3;
    }

/* =================================================================
   CSS：基本
   ================================================================= */
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bgpage);
      color:var(--text);
      font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial;
    }

/* =================================================================
   CSS：レイアウト
   ================================================================= */
    .container{max-width:1100px;margin:24px auto;padding:0 16px}

/* =================================================================
   CSS：ヘッダー
   ================================================================= */
    /* ── ヘッダ ── */
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      background:var(--panel); border:1px solid var(--border);
      padding:14px 16px; border-radius:16px; margin:12px 0 16px;
      box-shadow:0 2px 10px rgba(0,0,0,.04);
    }
    .brand h1{font-size:clamp(18px,3.8vw,22px);margin:0;}
      .brand{
      display:flex;
      flex-direction:column;
      gap:2px;
      flex:1;
      min-width:0;   /* ★ これがないと中身が縮んでくれない */
    }
    .topbar .right{display:flex;align-items:center;gap:8px;}

/* =================================================================
   CSS：ボタン
   ================================================================= */
    a.btn,button.btn{
      background:var(--brand); color:#102010;
      border:1px solid var(--brand-d);
      padding:8px 14px; border-radius:10px;
      text-decoration:none; cursor:pointer; font-size:14px;
    }
    a.btn.ghost,button.btn.ghost{
      background:var(--chip); color:var(--text);
      border:1px solid var(--border);
    }
    a.btn:hover,button.btn:hover{filter:brightness(1.03);}
    a.btn:active,button.btn:active{transform:translateY(1px);}
    a.btn:disabled,button.btn:disabled{opacity:.6;cursor:not-allowed;}

/* =================================================================
   CSS：操作行（フィルタ・選択）
   ================================================================= */
    /* ── フィルタ行 ── */
    .controls{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:0 0 18px;
      flex-wrap:wrap;          /* ★ ボタンが下の行に逃げられるように */
    }
    .controls select{
      flex:1;
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#fff; color:var(--text);
      font-size:15px;

      min-width:0;              /* ★ これがないと縮まってくれない */
      max-width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;   /* ★ 長いとき「…」で省略 */
    }
    .controls button.btn{
      white-space:nowrap;
    }
    .controls input[type="text"]{
      flex:1;
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#fff;
      color:var(--text);
      font-size:15px;
    }

/* =================================================================
   CSS：選択モード
   ================================================================= */
    /* ==== 選択モード / 選択状態の見た目 ==== */
    /* 選択モードボタン：ON のとき濃い色に */
    #toggleSelectMode.btn-on{
      background: var(--brand-d);
      color:#ffffff;
      border-color: var(--brand-d);
    }

    #toggleSelectMode.btn-on:hover{
      filter:brightness(1.05);
    }
    .select-hint{
      font-size:12px;
      color:var(--muted);
      margin:4px 0 10px;
    }
    /* カードが選択されているときの枠＆光り方 */
    .card.selected{
      border-color: var(--brand-d);
      box-shadow: 0 0 0 2px rgba(161, 212, 221, 0.7);
    }

/* =================================================================
   CSS：カード
   ================================================================= */
  /* カード全体 */
    .card{
      position:relative;
      display:flex;
      flex-direction:column;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 4px 18px rgba(0,0,0,.06);
      transition: box-shadow .18s ease-out, transform .18s ease-out, border-color .18s ease-out;
    }
    .card:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 22px rgba(0,0,0,.09);
    }
    /* カードの一番上の行（種別＋選択中） */
    .card-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:8px 12px 4px;
    }

    /* サムネ本体 */
    .thumb{
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      background:#f2f6ee;
      display:block;
      transition:transform .22s ease-out;
    }

    .card:hover .thumb{
      transform:scale(1.02);
    }
      /* 種別バッジ (image / video) */
    .thumb-kind-badge{
      padding:3px 8px;
      font-size:10px;
      border-radius:999px;
      background:rgba(255,255,255,0.94);
      border:1px solid rgba(0,0,0,0.05);
    }
    .thumb-kind-badge.is-video{
      color:#2d5560;
      background:rgba(238,248,251,0.98);
    }
    .thumb-kind-badge.is-image{
      color:#47644a;
      background:rgba(242,247,241,0.98);
    }
    /* 右側の「選択中」ピル */
    .card-select-pill{
      padding:3px 8px;
      font-size:10px;
      border-radius:999px;
      background:rgba(193,216,172,0.96);
      color:#102010;
      border:1px solid rgba(0,0,0,0.05);
      display:none;
    }
    .card.selected .card-select-pill{
      display:inline-flex;
      align-items:center;
      gap:4px;
    }
    .card.selected .card-select-pill::before{
      content:"✓";
      font-size:10px;
    }
      /* サムネ用ラッパ＋画像本体 */
    .thumb-wrap{
      overflow:hidden;
    }
    .thumb{
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      background:#f2f6ee;
      display:block;
      transition:transform .22s ease-out;
    }
    .card:hover .thumb{
      transform:scale(1.02);
    }
    /* サムネの下：タグ＋ボタン */
    .meta{
      padding:10px 12px 12px;
    }
    .tag-line{
      font-size:11px;
      color:#345c34;
      margin-bottom:8px;
      min-height:1.2em;
      word-break:break-word;
    }
    .actions{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:4px;
    }
    .actions button{
      width:100%;
      text-align:center;
      font-size:13px;
      padding:10px 12px;
      border-radius:12px;
    }
    .view{
      background:var(--chip);
      color:var(--text);
      border:1px solid var(--border);
    }

    /* カード全体が選択可能っぽく見えるように（選択モード中のみ） */
    body.select-mode .card{
      cursor: pointer;
    }
    body.select-mode .card button{
      cursor: pointer;
    }

/* =================================================================
   CSS：グリッド
   ================================================================= */
    /* ── グリッド ── */
    .grid{
      display:grid;
      /* PC では 230px 幅を目安に自動で 3〜4 列 */
      grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
      gap:14px;
    }

    /* ボタンを常に縦2段にする */
    .actions{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:10px;
    }
    .actions button{
      width:100%;
      text-align:center;
      font-size:13px;
      padding:10px 12px;
      border-radius:12px;
    }
    .view{
      background:var(--chip);
      color:var(--text);
      border:1px solid var(--border);
    }

/* =================================================================
   CSS：サブタイトル
   ================================================================= */
/* サブタイトル（ヘッダの2行目） */
.folder-header{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block;
  max-width:100%;
}

/* =================================================================
   CSS：レスポンシブ
   ================================================================= */
/* ==== モバイル用レイアウト調整 ==== */
@media (max-width: 768px){
  /* サムネを2列にする */
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .card{
    border-radius:12px;
  }
  .meta{
    padding:8px 10px;
  }
  .title{
    font-size:12px;
  }

  /* フィルタ行：1段目にプルダウンをフル幅で置く */
  .controls{
    flex-wrap:wrap;
  }
  .controls select{
    flex-basis:100%;  /* 1行占有して幅いっぱい */
  }
}

/* =================================================================
   CSS：プレビュー用モーダル
   ================================================================= */
    /* ==== プレビュー用モーダル調整 ==== */
    dialog#viewer {
      border: none;
      padding: 0;
      max-width: min(900px, 95vw);  /* PC でもスマホでもはみ出さない */
      width: 95vw;
      max-height: 90vh;             /* 画面からはみ出さない */
      margin: auto;
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
    }

    dialog#viewer::backdrop {
      background: rgba(0, 0, 0, 0.45); /* うっすら暗くする */
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      font-size: 14px;
    }

    .modal-head strong {
      font-size: 13px;
      font-weight: 600;
      max-width: 70%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-head button {
      border:none;
      background:transparent;
      padding:4px 8px;
      border-radius:0;
      font-size:18px;
      line-height:1;
      cursor:pointer;
    }

    .modal-body {
      padding: 10px 14px 16px;
      background: #fafdf9;
    }

    /* 中身の画像 / 動画は「枠内に収まる」＆「引き伸ばしすぎない」 */
    #v-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #v-container img,
    #v-container video {
      max-width: 100%;
      max-height: 70vh;   /* 画面高さの 70% まで */
      width: auto;
      height: auto;
      object-fit: contain; /* 収まり優先でトリミングしない */
      border-radius: 10px;
      background: #000;    /* 動画や縦長画像の余白が黒背景になる */
    }

    /* スマホだと少し縦を広めに使う */
    @media (max-width: 600px) {
      dialog#viewer {
        width: 96vw;
        max-width: 96vw;
        max-height: 90vh;
      }
      #v-container img,
      #v-container video {
        max-height: 75vh;
      }
    }

/* =================================================================
   CSS：ZIP作成ダイアログ
   ================================================================= */
    /* ==== ZIP作成ダイアログ ==== */
    #zipDialog {
      border: none;
      padding: 0;
      max-width: min(420px, 95vw);
      width: 95vw;
      margin: auto;
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
    }

    #zipDialog::backdrop {
      background: rgba(0, 0, 0, 0.45);
    }

    .zip-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .zip-bar {
      flex: 1;
      height: 10px;
      border-radius: 999px;
      background: #e6eef2;
      overflow: hidden;
    }

    #zipBarFill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--brand-d);
      transition: width 0.15s linear;
    }

    .zip-progress-text {
      font-size: 12px;
      color: var(--muted);
    }

/* =================================================================
   CSS：タグ絞り込み（操作行）
   ================================================================= */
    /* タグ行：1列でボタンを置くだけ */
    .controls-tags {
      margin-bottom: 10px;
    }

    .controls-tags .btn {
      width: 100%;
    }

    /* 選択行：左に DL ボタン、その右に選択モードボタン */
    .controls-select {
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
      justify-content:flex-start; /* 左寄せ */
    }
    .controls-select .controls-left,
    .controls-select .controls-right{
      display:flex;
      align-items:center;
      gap:8px;
    }

    /* 3段目：ヒント or 全選択/全解除 */
    .select-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin:4px 0 12px;
    }
    .select-hint{
      font-size:12px;
      color:var(--muted);
      margin:0;
    }
    .select-actions{
      display:none;          /* 選択モードONで flex に切り替え */
      gap:8px;
    }
    .select-actions .btn,
    button.btn.small{
      font-size:12px;
      padding:6px 10px;
    }

    /* スマホでは折り返しOK */
    @media (max-width: 768px) {
      .controls-select{
        flex-wrap:wrap;
      }
      .select-row{
        flex-wrap:wrap;
      }
    }
      button.btn[disabled] {
      opacity: .4;
      cursor: default;
      box-shadow: none;
    }

/* =================================================================
   CSS：タグ絞り込みモーダル
   ================================================================= */
    /* ==== タグ絞り込みモーダル ==== */
    dialog#tagDialog {
      border:none;
      padding:0;
      max-width:min(520px, 95vw);
      width:95vw;
      margin:auto;
      border-radius:16px;
      overflow:hidden;
      background:#ffffff;
    }

    dialog#tagDialog::backdrop {
      background:rgba(0,0,0,0.45);
    }

    .tag-body{
      padding:10px 14px 16px;
      background:#fafdf9;
      font-size:14px;
    }

    .tag-help{
      margin:0 0 8px;
      color:var(--muted);
      font-size:13px;
    }

    .tag-list{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:8px 0 12px;
    }

    .tag-chip{
      font-size:13px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--chip);
      color:var(--text);
      cursor:pointer;
    }

    .tag-chip.active{
      background:var(--brand);
      border-color:var(--brand-d);
      color:#102010;
    }

    .tag-footer{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:4px;
    }
  
/* =================================================================
   CSS：画面切り替え
   ================================================================= */
    /* 画面切り替え用 */
    .view{
      display:none;
    }
    .view.view-active{
      display:block;
    }
    /* ── フォルダ選択画面の一覧：白いカード＋インセット線 ── */
    .folder-list{
      margin-top:12px;
      background:#ffffff;
      border-radius:16px;
      border:1px solid var(--border);
      box-shadow:0 4px 18px rgba(0,0,0,.04);
      padding:4px 0;       /* 上下ちょっと余白 */
    }

    /* 1件分（ボタン） */
    .folder-item{
      width:100%;
      padding:10px 16px;   /* カードの内側に少し余白 */
      background:transparent;
      border:none;
      text-align:left;
      display:block;
      position:relative;   /* 区切り線用 */
      cursor:pointer;
    }

    /* 区切り線：左右少し余白をあけて線を引く */
    .folder-item::before{
      content:"";
      position:absolute;
      left:16px;
      right:16px;
      bottom:0;
      border-bottom:1px solid var(--border);
    }

    /* 最後の行だけ線を消す */
    .folder-item:last-child::before{
      border-bottom:none;
    }

    /* 1行目：日付 */
    .folder-item-date{
      font-size:12px;
      color:var(--muted);
      margin-bottom:2px;
    }

    /* 2行目：タイトル */
    .folder-item-title{
      font-size:14px;
      font-weight:600;
      line-height:1.6;
      color:var(--text);
      word-break:break-word;   /* 長いとき折り返し */
    }

      /* 右端の > アイコン（常に縦中央） */
    .folder-item::after{
      content:"›";                 /* 好みで "＞" でもOK */
      position:absolute;
      right:16px;
      top:50%;
      transform:translateY(-50%);  /* 行の真ん中にくるように */
      font-size:18px;
      color:var(--muted);
    }

      .folder-item:hover{
      background:#f9fbf7;
    }
      
    /* フォルダ選択ビュー／カタログビュー自体は枠なし＆背景なしにする */
    #view-folder-list,
    #view-catalog{
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }

    .folder-item{
      width:100%;
      padding:10px 40px 10px 16px;   /* ← 右を広めにして矢印のスペース確保 */
      background:transparent;
      border:none;
      text-align:left;
      display:block;
      position:relative;             /* 区切り線＆矢印用 */
      cursor:pointer;
    }
      
/* =================================================================
   CSS：フッター
   ================================================================= */
    /* フッター */
    footer{
      color:#94a38f; font-size:11px; margin:28px 0; text-align:center;
    }
</style>
</head>

<body>
  <!-- =========================
       HTML：ページ
       ========================= -->
  <div class="container">

    <!-- =========================
         HTML：フォルダ選択ビュー
         ========================= -->
    <!-- ▼▼ フォルダ選択ビュー ▼▼ -->
    <section id="view-folder-list" class="view view-active">
      <header class="topbar">
        <div class="brand">
          <h1>カタログ</h1>
          <div class="folder-header">見たいイベントのフォルダを選んでください</div>
        </div>
        <div class="right">
          <a href="#" id="toUploadFromList" class="btn">アップロードへ</a>
        </div>
      </header>
    
      <!-- フォルダ一覧カード -->
      <div id="folderList" class="folder-list"></div>
    </section>
    <!-- ▲▲ フォルダ選択ビュー ▲▲ -->

    <!-- =========================
         HTML：カタログビュー
         ========================= -->
    <!-- ▼▼ カタログビュー ▼▼ -->
    <section id="view-catalog" class="view">
      <header class="topbar">
        <div class="brand">
          <h1>カタログ</h1>
          <div id="folderHeader" class="folder-header"></div>
        </div>
        <div class="right">
          <button id="toFolderList"
                  class="btn ghost"
                  type="button"
                  data-view-target="view-folder-list">
            フォルダ選択画面へ
          </button>
        </div>
      </header>

      <!-- タグ検索ボタン -->
      <div class="controls controls-tags">
        <button id="tagFilterOpen" class="btn ghost" style="width:100%;">
          タグで絞り込む
        </button>
      </div>

      <!-- 2段目：DL＋選択モード -->
      <div class="controls controls-select">
        <div class="controls-left">
          <button id="bulkDownload" class="btn" disabled>ダウンロード (0)</button>
        </div>
        <div class="controls-right">
          <button id="toggleSelectMode" class="btn ghost">選択モード OFF</button>
        </div>
      </div>

      <!-- 3段目：ヒント or 全選択 / 全解除 -->
      <div class="select-row">
        <p id="selectHint" class="select-hint">
          写真を選択してダウンロードできます
        </p>
        <div id="selectActions" class="select-actions">
          <button id="selectAll" class="btn ghost small">全選択</button>
          <button id="clearSelection" class="btn ghost small">全解除</button>
        </div>
      </div>

      <div id="grid" class="grid"></div>
    </section>
    <!-- ▲▲ カタログビュー ▲▲ -->

    <!-- =========================
         HTML：フッター
         ========================= -->
    <footer id="copyright"></footer>
  </div>

  <!-- =========================
       HTML：プレビュー用ダイアログ
       ========================= -->
  <!-- プレビュー用ダイアログ -->
  <dialog id="viewer">
    <div class="modal-head">
      <strong id="v-title"></strong>
      <button id="v-close" aria-label="閉じる">×</button>
    </div>
    <div class="modal-body">
      <div id="v-container"></div>
    </div>
  </dialog>

  <!-- =========================
       HTML：ZIPダイアログ
       ========================= -->
  <!-- ZIP ダイアログ -->
  <dialog id="zipDialog">
    <div class="modal-head">
      <strong id="zipTitle">ZIP作成中…</strong>
    </div>
    <div class="modal-body">
      <p id="zipStatus" style="margin: 0 0 8px; font-size: 13px;">
        サーバーでZIPファイルを作成しています…
      </p>
      <div class="zip-progress">
        <div class="zip-bar">
          <div id="zipBarFill"></div>
        </div>
        <div id="zipProgressText" class="zip-progress-text">0%</div>
      </div>
    </div>
  </dialog>

  <!-- =========================
       HTML：タグ絞り込みモーダル
       ========================= -->
  <!-- タグ絞り込みモーダル -->
  <dialog id="tagDialog">
    <div class="modal-head">
      <strong>タグで絞り込む</strong>
      <button id="tagDialogClose" aria-label="閉じる">×</button>
    </div>
    <div class="modal-body tag-body">

<script>
/* =================================================================

/* ===== 設定 ===== */
const CONFIG = {
  WORKER_ORIGIN: "https://taiko-worker-plain.fujizukadaiko.workers.dev",
  INDEX_URL: "https://taiko-worker-plain.fujizukadaiko.workers.dev/catalog/index",

  FOLDER_LIST_URL: "https://fujizukadaiko.github.io/taiko-media-front-test/folders.html" // トップ画面（フォルダ一覧）のURLに合わせて変更
};

/* =================================================================
   JS：便利関数
   ================================================================= */
/* ===== 便利関数 ===== */
const $ = (s,p=document)=>p.querySelector(s);
const el = (t,props={}) => Object.assign(document.createElement(t), props);
const joinPath = (base, path) => base.replace(/\/+$/,"") + path;
const isVideo = (name='') => /\.(mp4|mov|webm|m4v)$/i.test(name);

/** manifest が "/catalog?..." みたいなパスでも
 *  "https://...workers.dev/catalog?..." に直すヘルパー
 */
function toWorkerUrl(pathOrUrl) {
  if (!pathOrUrl) return "";
  // すでに http(s) から始まるならそのまま
  if (/^https?:\/\//.test(pathOrUrl)) return pathOrUrl;
  // 先頭が "/" などの相対パス → WORKER_ORIGIN を前にくっつける
  return joinPath(CONFIG.WORKER_ORIGIN, pathOrUrl);
}
  
// --- lazy load 用（1回だけ作る） ---
const THUMB_PLACEHOLDER = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";

const thumbIO = new IntersectionObserver((entries) => {
  for (const ent of entries) {
    if (!ent.isIntersecting) continue;
    const img = ent.target;
    const src = img.dataset.src;
    if (src) img.src = src;
    thumbIO.unobserve(img);
  }
}, { rootMargin: "300px" }); // 300px手前で先読み
/* =================================================================
   JS：状態
   ================================================================= */
/* ===== 状態 ===== */
let currentManifestUrl = "";
let currentItems = [];
let currentFolderNasLink = null;   // ★ 追加：NASリンク（今は null のままでもOK）
const selectedKeys = new Set();

// ★ 追加：このフォルダに属する「元のアイテム一覧」を保持
let originalItems = [];

// ★ 追加：現在選択中フォルダのメタ情報
let currentFolderMeta = {
  date: null,
  title: "",
  place: null,
  note: null,
};

// ★ 追加：選択モード ON/OFF
let selectionMode = false;

// すべてのタグ一覧（モーダル表示用）
let allTags = [];
let selectedTagFilters = [];  // モーダルで選ばれているタグ

/* =================================================================
   JS：画面切り替え
   ================================================================= */
/* ===== 画面切り替え（view） ===== */
function switchView(targetId){
  document.querySelectorAll(".view").forEach(v => {
    v.classList.toggle("view-active", v.id === targetId);
  });
}

   JS：フォルダ一覧

async function loadFolderIndex(){
  const res = await fetch(CONFIG.INDEX_URL);
  console.log("[index] url=", CONFIG.INDEX_URL, "status=", res.status);
  if (!res.ok) throw new Error("index fetch failed");
  const { folders = [] } = await res.json();

  if (!folders.length) return;

  // ★ フォルダ選択画面に一覧を描画
  renderFolderList(folders);

  // 「最初に開くフォルダ」をどうするかは好みですが、
  // いまは「フォルダ選択画面を最初に見せる」ので
  // 自動で renderFolder() しなくてもOK。

// フォルダ一覧を表示する関数
function renderFolderList(folders) {
  const listEl = document.getElementById("folderList");
  if (!listEl) return;
  listEl.innerHTML = "";

  // ★ まず ALL 行を追加
  {
    const row = el("button", {
      type: "button",
      className: "folder-item",
    });

    const dateDiv = el("div", {
      className: "folder-item-date",
      textContent: "ALL",
    });

      className: "folder-item-title",

    row.addEventListener("click", async () => {

/* =================================================================
   JS：グリッド描画
   ================================================================= */
/* ===== グリッド描画 共通関数 ===== */
function renderGrid(items, folderNasLink){
  // 状態を更新
  currentItems = items || [];
  const grid = $("#grid");
  grid.innerHTML = "";

  updateBulkButton();
  updateSelectButtonsState();

  // フォルダごとDL用バー（NASリンク）
  if (folderNasLink && /^https?:\/\//.test(folderNasLink)){
    const bar = el("div", {
      className: "card",
      style: "padding:12px;border:1px dashed var(--border);background:#fff"
    });
    const a = el("a", {
      href: folderNasLink,
      target: "_blank",
      textContent: "フォルダごとダウンロード（NAS共有）"
    });
    bar.appendChild(a);
    grid.appendChild(bar);
  }

  for (const item of currentItems){
    const card = el("div", { className: "card" });
    const kind = isVideo(item.key) ? "video" : "image";

    // このカードの選択状態
    let isSelected = selectedKeys.has(item.key);

    const setSelected = (on) => {
      isSelected = !!on;
      if (isSelected) {
        selectedKeys.add(item.key);
      } else {
        selectedKeys.delete(item.key);
      }
      card.classList.toggle("selected", isSelected);
      updateBulkButton();
      updateSelectButtonsState();
    };

    // ── 上部ヘッダ（種別バッジ + 選択中ピル） ──
    const header = el("div", { className: "card-header" });

    const kindBadge = el("span", {
      className:
        "thumb-kind-badge " +
        (kind === "video" ? "is-video" : "is-image"),
      textContent: kind
    });

    const selectPill = el("span", {
      className: "card-select-pill",
      textContent: "選択中"
    });

    header.appendChild(kindBadge);
    header.appendChild(selectPill);
    card.appendChild(header);

    // ── サムネイル ──
    const thumbWrap = el("div", { className: "thumb-wrap" });

    const img = el("img", {
      className: "thumb",
      alt: item.title || "",
      loading: "lazy",
      decoding: "async",
      referrerPolicy: "no-referrer",
    });

    // 最初は軽いプレースホルダだけ
    img.src = THUMB_PLACEHOLDER;

    // 本物URLは data-src に入れて、見える直前で読み込む
    if (item.thumb) img.dataset.src = item.thumb;

    thumbWrap.appendChild(img);
    card.appendChild(thumbWrap);

    // Observer に登録（item.thumb があるときだけ）
    if (item.thumb) thumbIO.observe(img);

    // ── タグ行 (#タグ1 #タグ2 …) ──
    const meta = el("div", { className: "meta" });

    const tagLineText =
      Array.isArray(item.tags) && item.tags.length
        ? item.tags.map((t) => `#${t}`).join(" ")
        : "";

    const tagLine = el("div", {
      className: "tag-line",
      textContent: tagLineText
    });

    meta.appendChild(tagLine);
    card.appendChild(meta);

    // 初期の選択状態を反映
    if (isSelected) {
      card.classList.add("selected");
    }

    // ── 画像クリック：通常時はプレビュー、選択モード中は選択トグル ──
    img.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();

      // 選択モード中 → プレビューは出さず、選択トグル
      if (selectionMode) {
        setSelected(!isSelected);
        return;
      }

      // 通常モード → プレビューを開く（タイトルは空）
      try {
        if (item.storage === "nas" && item.nasUrl) {
          openViewer("", item.nasUrl, isVideo(item.nasUrl || item.key));
          return;
        }

        const pres = await fetch(
          joinPath(CONFIG.WORKER_ORIGIN, "/files/presign-get"),
          {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              key: item.key,
              expires: CONFIG.PRESIGN_EXPIRES
            })
          }
        );
        const { url } = await pres.json();
        if (!url) throw new Error("empty url");
        openViewer("", url, isVideo(item.key));
      } catch (e) {
        console.error(e);
        alert("プレビューURLの発行に失敗しました");
      }
    });

    // ── カード全体クリック（選択モードのときだけ有効） ──
    card.addEventListener("click", (e) => {
      if (!selectionMode) return;
      setSelected(!isSelected);
    });

    grid.appendChild(card);
  }
}

async function renderFolder(manifestUrl){

  const res = await fetch(manifestUrl);
  console.log("[manifest] status=", res.status);
  if (!res.ok) throw new Error("manifest fetch failed");

  };

   ================================================================= */
/* ===== 原本DL(複数) → ZIP一括DL ===== */
function updateBulkButton() {
  const n = selectedKeys.size;
  const btn = document.getElementById("bulkDownload");
  if (!btn) return;
  btn.textContent = `ダウンロード (${n})`;
  // 選択モードで、かつ1件以上選ばれているときだけ有効
  btn.disabled = !selectionMode || n === 0;
}

document.getElementById("bulkDownload")?.addEventListener("click", async () => {
  if (selectedKeys.size === 0) return;

  const keys = Array.from(selectedKeys);

  // 件数チェック（サーバー側でもチェックしている想定だけど念のため）
  if (keys.length > 100) {
    alert("一度にダウンロードできるのは最大100件までです。枚数を減らしてください。");
    return;
  }

  showZipDialog();

  try {
    const res = await fetch(
      joinPath(CONFIG.WORKER_ORIGIN, "/files/zip"),
      {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ keys }),
      }
    );

    if (!res.ok) {
      console.error("zip failed:", res.status);
      finishZipDialog(false);
      return;
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);

    // フォルダの日付を ZIP 名に使う（なければ "download"）
    const baseName =
      (currentFolderMeta && currentFolderMeta.date) ||
      "download";

    const a = document.createElement("a");
    a.href = url;
    a.download = `${baseName}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // URL開放
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    finishZipDialog(true);
  } catch (e) {
    console.error(e);
    finishZipDialog(false);
  }
});

/* =================================================================
   JS：選択モード
   ================================================================= */
/* ===== 選択モードのON/OFFとボタン状態更新 ===== */
function setSelectionMode(on) {
  selectionMode = !!on;
  // bodyにクラスを付けてCSS制御
  document.body.classList.toggle("select-mode", selectionMode);

  // モードOFFにしたときは選択をクリア
  if (!selectionMode) {
    selectedKeys.clear();
  }

  // ボタン状態を更新
  updateBulkButton();
  updateSelectButtonsState();

  // カードの見た目を再描画
  renderGrid(currentItems, currentFolderNasLink);
}

function updateSelectButtonsState() {
  const n         = selectedKeys.size;
  const btnToggle = document.getElementById("toggleSelectMode");
  const btnAll    = document.getElementById("selectAll");
  const btnClear  = document.getElementById("clearSelection");
  const hint      = document.getElementById("selectHint");
  const actions   = document.getElementById("selectActions");

  // 選択モードボタンの表示
  if (btnToggle) {
    btnToggle.textContent = selectionMode ? "選択モード ON" : "選択モード OFF";
    btnToggle.classList.toggle("btn-on", selectionMode);
  }

  // 3段目：ヒント or 全選択/全解除 の切り替え
  if (hint && actions) {
    if (selectionMode) {
      hint.style.display    = "none";
      actions.style.display = "flex";
    } else {
      hint.style.display    = "";
      actions.style.display = "none";
    }
  }

  // 全選択 / 全解除の活性・非活性
  if (btnAll) {
    const allSelected = currentItems.length > 0 && n === currentItems.length;
    btnAll.disabled = !selectionMode || currentItems.length === 0 || allSelected;
  }
  if (btnClear) {
    btnClear.disabled = !selectionMode || n === 0;
  }
}

/* ===== ZIP作成ダイアログ制御 ===== */
let zipProgressTimer = null;

function showZipDialog() {
  const dlg   = document.getElementById("zipDialog");
  const title = document.getElementById("zipTitle");
  const msg   = document.getElementById("zipStatus");
  const bar   = document.getElementById("zipBarFill");
  const txt   = document.getElementById("zipProgressText");

  if (!dlg) return;

  if (title) title.textContent = "ZIP作成中…";
  if (msg)   msg.textContent   = "サーバーでZIPファイルを作成しています…";
  if (bar)   bar.style.width   = "0%";
  if (txt)   txt.textContent   = "0%";

  dlg.showModal();

  // 疑似プログレス（〜90% までゆっくり上がる）
  let p = 5;
  if (zipProgressTimer) clearInterval(zipProgressTimer);
  zipProgressTimer = setInterval(() => {
    p = Math.min(p + Math.random() * 5, 90);
    if (bar) bar.style.width = p + "%";
    if (txt) txt.textContent = Math.round(p) + "%";
  }, 300);
}

function finishZipDialog(success) {
  const dlg   = document.getElementById("zipDialog");
  const title = document.getElementById("zipTitle");
  const msg   = document.getElementById("zipStatus");
  const bar   = document.getElementById("zipBarFill");
  const txt   = document.getElementById("zipProgressText");

  if (zipProgressTimer) {
    clearInterval(zipProgressTimer);
    zipProgressTimer = null;
  }

  if (bar) bar.style.width = "100%";
  if (txt) txt.textContent = "100%";

  if (title) {
    title.textContent = success
      ? "ダウンロードを開始しました"
      : "ZIPの作成に失敗しました";
  }
  if (msg) {
    msg.textContent = success
      ? "ブラウザのダウンロード一覧からZIPファイルをご確認ください。"
      : "ZIPの作成に失敗しました。選択枚数を減らして再度お試しください。";
  }

  // 1.8秒くらい表示してから自動で閉じる
  setTimeout(() => {
    try { dlg && dlg.close(); } catch (_) {}
  }, 1800);
}

/* ===== タグ編集（prompt版） ===== */
async function openTagEditor(item){
  const currentText = Array.isArray(item.tags) ? item.tags.join(" ") : "";

  const input = prompt(
    "タグをスペース区切りで入力してください（例: 発表 子どもの部 かるがもマラソン）",
    currentText
  );
  if (input === null) return;

  const tags = input
    .split(/\s+/)
    .map(t => t.trim())
    .filter(t => t.length > 0);

  const hadBefore = Array.isArray(item.tags) && item.tags.length > 0;
  if (hadBefore && tags.length === 0) {
    const really = confirm("このメディアについているタグを全て削除します。よろしいですか？");
    if (!really) return;
  }

  try{
    const res = await fetch(
      joinPath(CONFIG.WORKER_ORIGIN, "/items/tag"),
      {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          key: item.key,
          tags
        })
      }
    );
    const js = await res.json();

    if (!res.ok || !js.ok){
      console.error(js);
      alert("タグの更新に失敗しました");
      return;
    }

    item.tags = js.tags;
    await renderFolder(currentManifestUrl);
  }catch(e){
    console.error(e);
    alert("タグ更新中にエラーが発生しました");
  }
}

   ================================================================= */
/* ===== タグ検索（モーダルで選んだタグの AND 条件・フォルダ内） ===== */
async function searchByTags(tags){
  // タグ未選択なら「元のフォルダの一覧」に戻す
  if (!tags || !tags.length) {
    currentItems = originalItems;
    renderGrid(currentItems, currentFolderNasLink);
    return;
  }

  // AND 条件でフィルタ
  const filtered = originalItems.filter(item => {
    const itemTags = Array.isArray(item.tags) ? item.tags : [];
    // すべての選択タグが含まれているか
    return tags.every(t => itemTags.includes(t));
  });

  currentItems = filtered;
  renderGrid(currentItems, currentFolderNasLink);
}

/* =================================================================
   JS：タグ絞り込みモーダル
   ================================================================= */
 /* ===== タグモーダルを開いて一覧を表示（このフォルダ内のタグのみ） ===== */
async function openTagFilterDialog(){
  const dlg  = document.getElementById("tagDialog");
  const list = document.getElementById("tagList");
  if (!dlg || !list) return;

  // ★ このフォルダ内のタグを集計
  const tagSet = new Set();
  for (const item of originalItems) {
    if (Array.isArray(item.tags)) {
      for (const t of item.tags) {
        if (t && typeof t === "string") {
          tagSet.add(t);
        }
      }
    }
  }
  allTags = Array.from(tagSet).sort();

  // 一覧を描画
  list.innerHTML = "";
  if (!allTags.length) {
    const p = document.createElement("p");
    p.textContent = "このフォルダにはタグがまだありません。";
    p.style.fontSize = "13px";
    p.style.color = "#888";
    list.appendChild(p);
  } else {
    for (const tag of allTags) {
      const isActive = selectedTagFilters.includes(tag);
      const chip = el("button", {
        type:"button",
        textContent: tag,
        className: "tag-chip" + (isActive ? " active" : "")
      });
      chip.addEventListener("click", () => {
        const idx = selectedTagFilters.indexOf(tag);
        if (idx >= 0) {
          selectedTagFilters.splice(idx, 1);
          chip.classList.remove("active");
        } else {
          selectedTagFilters.push(tag);
          chip.classList.add("active");
        }
      });
      list.appendChild(chip);
    }
  }

  try{
    dlg.showModal();
  }catch(e){
    console.error(e);
  }
}
  
/* =================================================================
   JS：表示用ヘルパー
   ================================================================= */
// YYYYMMDD → "YYYY年MM月DD日" くらいに整形
function formatDateJp(dateStr){
  if (!/^\d{8}$/.test(dateStr || "")) return dateStr || "";
  const y = dateStr.slice(0, 4);
  const m = dateStr.slice(4, 6);
  const d = dateStr.slice(6, 8);
  return `${y}年${m}月${d}日`;
}

// 上部サブタイトルの描画
function updateFolderHeader() {
  const elHeader = document.getElementById("folderHeader");
  if (!elHeader) return;

  const parts = [];

  // 日付があるときだけ日付を入れる
  if (currentFolderMeta.date) {
    parts.push(formatDateJp(currentFolderMeta.date));
  }

  // タイトル（イベント名 or "すべての写真"）があれば入れる
  if (currentFolderMeta.title) {
    parts.push(currentFolderMeta.title);
  }

  elHeader.textContent = parts.join(" ｜ ");
}

/* ===== 起動 ===== */
document.addEventListener("DOMContentLoaded", () => {
  // ▼ フォルダ選択画面へ：view 切り替え
  document.getElementById("toFolderList")?.addEventListener("click", () => {
    switchView("view-folder-list");
  });
    // アップロードへボタン（フォルダ選択画面）
  document.getElementById("toUploadFromList")?.addEventListener("click", (e) => {
    e.preventDefault();
    if (CONFIG.UPLOAD_URL) {
      location.href = CONFIG.UPLOAD_URL;
    }
  });

  // アップロードへボタン（カタログ画面）
  document.getElementById("toUploadFromCatalog")?.addEventListener("click", (e) => {
    e.preventDefault();
    if (CONFIG.UPLOAD_URL) {
      location.href = CONFIG.UPLOAD_URL;
    }
  });

    const input = $("#tagSearchInput");
  const btnSearch = $("#tagSearchButton");
  const btnClear  = $("#tagSearchClear");

  btnSearch?.addEventListener("click", () => {
    runTagSearch();
  });

  input?.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      runTagSearch();
    }
  });

  btnClear?.addEventListener("click", async () => {
    if (input) input.value = "";
    if (currentManifestUrl) {
      await renderFolder(currentManifestUrl);
    }
  });
  // ★ 選択モードボタン類
  const btnToggleSelect = document.getElementById("toggleSelectMode");
  const btnSelectAll    = document.getElementById("selectAll");
  const btnClearSel     = document.getElementById("clearSelection");

  btnToggleSelect?.addEventListener("click", () => {
    setSelectionMode(!selectionMode);
  });

  btnSelectAll?.addEventListener("click", () => {
    if (!selectionMode) return;
    for (const item of currentItems) {
      selectedKeys.add(item.key);
    }
    renderGrid(currentItems, currentFolderNasLink);
  });

  btnClearSel?.addEventListener("click", () => {
    if (!selectionMode) return;
    selectedKeys.clear();
    renderGrid(currentItems, currentFolderNasLink);
  });
  
  // タグ絞り込みボタン → モーダルを開く
  const btnTagFilter = document.getElementById("tagFilterOpen");
  btnTagFilter?.addEventListener("click", () => {
    openTagFilterDialog();
  });

  // タグモーダルのボタンたち
  document.getElementById("tagDialogClose")?.addEventListener("click", () => {
    document.getElementById("tagDialog")?.close();
  });

  document.getElementById("tagClear")?.addEventListener("click", async () => {
    selectedTagFilters = [];
    await searchByTags([]);  // 絞り込み解除
    // チップの見た目もリセット
    document.querySelectorAll("#tagList .tag-chip").forEach(chip => {
      chip.classList.remove("active");
    });
  });

  document.getElementById("tagApply")?.addEventListener("click", async () => {
    await searchByTags(selectedTagFilters);
    document.getElementById("tagDialog")?.close();
  });
  // 初期状態のボタン表示
  updateSelectButtonsState();
  loadFolderIndex();
});
